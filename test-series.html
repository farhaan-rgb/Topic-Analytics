<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Series - Teachmint</title>
  <style>
    :root {
      --text: #f2f4ff;
      --muted: #99a0bc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% -5%, #203066 0%, transparent 45%),
        linear-gradient(160deg, #07080f 0%, #0a0d1a 60%, #080a13 100%);
      min-height: 100vh;
      padding-bottom: 86px;
    }
    .hidden { display: none !important; }
    .app-wrap {
      width: min(600px, 94vw);
      margin: 1.1rem auto;
    }
    .panel {
      background: linear-gradient(150deg, rgba(22, 24, 38, 0.95), rgba(15, 17, 27, 0.95));
      border: 1px solid #252a3a;
      border-radius: 16px;
      padding: 1rem;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.75rem;
    }
    .brand-row { display: flex; align-items: center; gap: 0.65rem; }
    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(160deg, #2cc2ff, #0f8dcc);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(24, 181, 255, 0.35);
    }
    .brand-logo svg { width: 25px; height: 25px; }
    h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2rem); }
    .welcome { color: var(--muted); font-size: 0.88rem; margin-top: 0.15rem; }
    .logout-btn {
      border: 1px solid #3a405a;
      background: #21263a;
      color: #f2f4ff;
      border-radius: 12px;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .exam-shell {
      border: 1px solid #2f3a56;
      border-radius: 12px;
      background: linear-gradient(155deg, #171f34, #13192a);
      padding: 0.58rem 0.65rem;
      margin-bottom: 0.9rem;
    }
    .exam-label {
      font-size: 0.77rem;
      color: #8ea1cb;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.34rem;
      font-weight: 600;
    }
    .exam-select-wrap {
      position: relative;
    }
    .exam-trigger {
      width: 100%;
      border: 1px solid #3f4f77;
      border-radius: 11px;
      background: #1b2642;
      color: #eef3ff;
      padding: 0.66rem 2rem 0.66rem 0.72rem;
      font: inherit;
      text-align: left;
      cursor: pointer;
      position: relative;
    }
    .exam-trigger::after {
      content: "";
      position: absolute;
      right: 0.68rem;
      top: 50%;
      width: 0.46rem;
      height: 0.46rem;
      border-right: 2px solid #9cb2de;
      border-bottom: 2px solid #9cb2de;
      transform: translateY(-65%) rotate(45deg);
      opacity: 0.9;
    }
    .exam-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 0.38rem);
      z-index: 8;
      border: 1px solid #425585;
      border-radius: 11px;
      background: #182238;
      padding: 0.25rem;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.34);
    }
    .exam-option {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #eaf0ff;
      text-align: left;
      padding: 0.48rem 0.5rem;
      font: inherit;
      cursor: pointer;
    }
    .exam-option:hover,
    .exam-option.active {
      background: #243458;
      color: #fff;
    }
    .tests-list {
      display: grid;
      gap: 0.75rem;
    }
    .test-card {
      border: 1px solid #2d3857;
      border-radius: 13px;
      background: linear-gradient(155deg, rgba(31, 42, 67, 0.93), rgba(20, 28, 44, 0.93));
      padding: 0.75rem;
    }
    .test-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.7rem;
    }
    .test-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.25;
    }
    .test-meta {
      margin-top: 0.28rem;
      color: #a9b5d7;
      font-size: 0.84rem;
      line-height: 1.3;
    }
    .timer-pill {
      border: 1px solid #3f5e8e;
      border-radius: 999px;
      padding: 0.25rem 0.56rem;
      color: #cbe4ff;
      background: #17335a;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .timer-pill.live {
      border-color: #3aca78;
      background: #1f4f38;
      color: #d8ffe8;
    }
    .test-actions {
      margin-top: 0.68rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    .test-btn {
      border: 1px solid #48618f;
      border-radius: 10px;
      background: #1f3052;
      color: #eff4ff;
      padding: 0.44rem 0.72rem;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }
    .test-btn.primary {
      border-color: #2f9bf0;
      background: linear-gradient(135deg, #2f9bf0, #2377bc);
      color: #fff;
    }
    .status-note {
      color: #9eb0d8;
      font-size: 0.82rem;
      min-height: 1rem;
    }
    .module-overlay {
      position: fixed;
      inset: 0;
      z-index: 32;
      background: rgba(4, 7, 12, 0.74);
      display: grid;
      place-items: center;
      padding: 0.9rem;
    }
    .module-card {
      width: min(760px, 96vw);
      max-height: 92vh;
      overflow: auto;
      border: 1px solid #314875;
      border-radius: 16px;
      background: linear-gradient(180deg, #123055 0%, #0d213a 32%, #08111f 100%);
      padding: 0.9rem;
    }
    .module-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.7rem;
    }
    .module-close {
      border: 1px solid #4a6380;
      background: rgba(16, 34, 56, 0.85);
      color: #eef4ff;
      border-radius: 11px;
      padding: 0.46rem 0.66rem;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .module-progress {
      color: #c7d5e9;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .module-topic {
      border: 1px solid rgba(167, 196, 228, 0.2);
      background: linear-gradient(180deg, rgba(29, 66, 106, 0.85), rgba(21, 47, 75, 0.85));
      border-radius: 14px;
      padding: 0.95rem;
      margin-bottom: 0.95rem;
    }
    .module-topic h3 {
      margin: 0;
      font-size: clamp(1.12rem, 3.8vw, 1.45rem);
      line-height: 1.25;
    }
    .module-meta { margin-top: 0.35rem; color: #a8b5ca; font-size: 0.9rem; }
    .module-q {
      margin: 0 0 0.95rem;
      font-size: clamp(1.25rem, 4.1vw, 1.85rem);
      font-weight: 600;
      line-height: 1.27;
      color: #f6f8ff;
    }
    .module-options { display: grid; gap: 0.68rem; }
    .module-opt {
      width: 100%;
      text-align: left;
      border: 1px solid #3b4f66;
      border-radius: 13px;
      background: #26384c;
      color: #edf2ff;
      padding: 0.78rem 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.72rem;
      font: inherit;
      font-size: 0.98rem;
    }
    .module-tag {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #41566e;
      color: #ecf3ff;
      display: grid;
      place-items: center;
      font-weight: 700;
      flex-shrink: 0;
    }
    .module-opt.selected { border-color: #8ec3ff; background: #30465e; }
    .module-opt.correct { border-color: #4ad69f; background: #20483f; }
    .module-opt.wrong { border-color: #ff7fa3; background: #4a2734; }
    .module-actions {
      margin-top: 0.9rem;
      display: flex;
      justify-content: center;
    }
    .module-action {
      border: 0;
      border-radius: 10px;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      background: #2a7ac2;
      color: white;
      font-weight: 600;
      font: inherit;
    }
    .module-action:disabled { opacity: 0.55; cursor: not-allowed; }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      border-top: 1px solid #2d3551;
      background: rgba(10, 14, 24, 0.97);
      backdrop-filter: blur(6px);
      padding: 0.55rem 0.8rem calc(0.55rem + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.6rem;
    }
    .bottom-btn {
      border: 1px solid #3a4260;
      border-radius: 12px;
      background: #1a2237;
      color: #dbe4ff;
      padding: 0.62rem 0.5rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .bottom-btn.active {
      border-color: #2aa8f4;
      background: #223d63;
      color: #eff6ff;
      box-shadow: inset 0 0 0 1px rgba(47, 155, 240, 0.35);
    }
  </style>
</head>
<body>
  <main class="app-wrap">
    <section class="panel">
      <div class="topbar">
        <div>
          <div class="brand-row">
            <div class="brand-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 7.5L12 3l9 4.5-9 4.5L3 7.5Z" fill="#E7F8FF" opacity=".95"/>
                <path d="M3 11.6 12 16l9-4.4" stroke="#D6F2FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 7.2v11.2" stroke="#0C5E8D" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </div>
            <h1>Teachmint</h1>
          </div>
          <div id="welcomeText" class="welcome">Test Series</div>
        </div>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </div>

      <div class="exam-shell">
        <div class="exam-label">Exam</div>
        <div class="exam-select-wrap">
          <button id="examTrigger" class="exam-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">JEE</button>
          <div id="examMenu" class="exam-menu hidden" role="listbox" aria-label="Select exam">
            <button class="exam-option" data-exam="JEE" type="button">JEE</button>
            <button class="exam-option" data-exam="NEET" type="button">NEET</button>
            <button class="exam-option" data-exam="UPSC" type="button">UPSC</button>
          </div>
        </div>
      </div>

      <div id="testsList" class="tests-list"></div>
    </section>
  </main>

  <div id="testModuleOverlay" class="module-overlay hidden">
    <div class="module-card">
      <div class="module-top">
        <button id="closeModuleBtn" class="module-close" type="button">Back</button>
        <div id="moduleProgress" class="module-progress">Question 0 / 0</div>
      </div>
      <section class="module-topic">
        <h3 id="moduleTitle">Loading...</h3>
        <div id="moduleMeta" class="module-meta"></div>
      </section>
      <section id="moduleQuiz">
        <p id="moduleQuestion" class="module-q"></p>
        <div id="moduleOptions" class="module-options"></div>
        <div class="module-actions">
          <button id="moduleActionBtn" class="module-action" type="button" disabled>Check Answer</button>
        </div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Bottom navigation">
    <button id="goStudyBtn" class="bottom-btn" type="button">Study Materials</button>
    <button id="goPracticeBtn" class="bottom-btn" type="button">Practice</button>
    <button class="bottom-btn active" type="button">Test Series</button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    const api = window.teachmintApi;

    const examTrigger = document.getElementById("examTrigger");
    const examMenu = document.getElementById("examMenu");
    const examOptions = Array.from(document.querySelectorAll(".exam-option"));
    const testsList = document.getElementById("testsList");
    const welcomeText = document.getElementById("welcomeText");
    const logoutBtn = document.getElementById("logoutBtn");
    const goStudyBtn = document.getElementById("goStudyBtn");
    const goPracticeBtn = document.getElementById("goPracticeBtn");
    const testModuleOverlay = document.getElementById("testModuleOverlay");
    const closeModuleBtn = document.getElementById("closeModuleBtn");
    const moduleProgress = document.getElementById("moduleProgress");
    const moduleTitle = document.getElementById("moduleTitle");
    const moduleMeta = document.getElementById("moduleMeta");
    const moduleQuestion = document.getElementById("moduleQuestion");
    const moduleOptions = document.getElementById("moduleOptions");
    const moduleActionBtn = document.getElementById("moduleActionBtn");

    const testTemplates = {
      JEE: [
        { id: "jee-1", title: "JEE Mock Test 1", syllabus: "Maths + Physics + Chemistry", questions: 90, minutes: 180 },
        { id: "jee-2", title: "JEE Mock Test 2", syllabus: "Core Concepts Revision", questions: 75, minutes: 150 },
        { id: "jee-3", title: "JEE Speed Test", syllabus: "Mixed High-Weightage Topics", questions: 45, minutes: 60 }
      ],
      NEET: [
        { id: "neet-1", title: "NEET Mock Test 1", syllabus: "Biology + Physics + Chemistry", questions: 180, minutes: 180 },
        { id: "neet-2", title: "NEET Mock Test 2", syllabus: "NCERT Based Mix", questions: 120, minutes: 120 },
        { id: "neet-3", title: "NEET Time Trial", syllabus: "High-Frequency NEET Topics", questions: 60, minutes: 60 }
      ],
      UPSC: [
        { id: "upsc-1", title: "UPSC Prelims Mock 1", syllabus: "Polity + History + Geography", questions: 100, minutes: 120 },
        { id: "upsc-2", title: "UPSC CSAT Drill", syllabus: "Aptitude + Reasoning + Comprehension", questions: 80, minutes: 120 },
        { id: "upsc-3", title: "UPSC Rapid Revision Test", syllabus: "Static + Current Affairs Blend", questions: 50, minutes: 60 }
      ]
    };

    const runningTimers = {};
    const remainingSeconds = {};
    let currentUser = null;
    let selectedExam = "JEE";
    let activeTest = null;
    let moduleQuestions = [];
    let moduleIndex = 0;
    let moduleSelectedChoice = null;
    let moduleEvaluated = false;
    const optionTags = ["A", "B", "C", "D", "E", "F"];

    function syncExamDropdown() {
      examTrigger.textContent = selectedExam;
      examTrigger.setAttribute("aria-expanded", examMenu.classList.contains("hidden") ? "false" : "true");
      for (const option of examOptions) {
        option.classList.toggle("active", option.dataset.exam === selectedExam);
      }
    }

    function closeExamMenu() {
      examMenu.classList.add("hidden");
      syncExamDropdown();
    }

    function formatTime(totalSec) {
      const sec = Math.max(0, Number(totalSec) || 0);
      const mm = String(Math.floor(sec / 60)).padStart(2, "0");
      const ss = String(sec % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function stopTimer(testId) {
      if (runningTimers[testId]) {
        clearInterval(runningTimers[testId]);
        delete runningTimers[testId];
      }
    }

    function renderTests() {
      const exam = selectedExam;
      const tests = Array.isArray(testTemplates[exam]) ? testTemplates[exam] : [];
      testsList.innerHTML = "";
      for (const t of tests) {
        if (!Number.isFinite(remainingSeconds[t.id])) {
          remainingSeconds[t.id] = t.minutes * 60;
        }
        const card = document.createElement("article");
        card.className = "test-card";

        const live = Boolean(runningTimers[t.id]);
        const timerClass = live ? "timer-pill live" : "timer-pill";
        const timerText = formatTime(remainingSeconds[t.id]);

        card.innerHTML = `
          <div class="test-head">
            <div>
              <h3 class="test-title">${t.title}</h3>
              <div class="test-meta">${t.syllabus}</div>
              <div class="test-meta">${t.questions} questions • ${t.minutes} mins</div>
            </div>
            <div class="${timerClass}" id="timer-${t.id}">${timerText}</div>
          </div>
          <div class="test-actions">
            <button class="test-btn primary" type="button" id="create-${t.id}">${live ? "Resume Test" : "Create Test"}</button>
            <button class="test-btn" type="button" id="reset-${t.id}">Reset</button>
            <span class="status-note" id="note-${t.id}">${live ? "Timer is running..." : "Ready to start."}</span>
          </div>
        `;
        testsList.appendChild(card);

        const timerEl = card.querySelector(`#timer-${t.id}`);
        const createBtn = card.querySelector(`#create-${t.id}`);
        const resetBtn = card.querySelector(`#reset-${t.id}`);
        const noteEl = card.querySelector(`#note-${t.id}`);

        createBtn.disabled = remainingSeconds[t.id] <= 0;
        createBtn.addEventListener("click", () => {
          if (remainingSeconds[t.id] <= 0) return;
          if (!runningTimers[t.id]) {
            timerEl.classList.add("live");
            noteEl.textContent = "Timer is running...";
            runningTimers[t.id] = setInterval(() => {
              remainingSeconds[t.id] -= 1;
              timerEl.textContent = formatTime(remainingSeconds[t.id]);
              if (remainingSeconds[t.id] <= 0) {
                stopTimer(t.id);
                remainingSeconds[t.id] = 0;
                createBtn.disabled = true;
                createBtn.textContent = "Completed";
                timerEl.classList.remove("live");
                noteEl.textContent = "Time up. Test completed.";
                timerEl.textContent = "00:00";
                if (activeTest && activeTest.id === t.id) {
                  closeTestModule();
                }
              }
            }, 1000);
          }
          createBtn.textContent = "Resume Test";
          openTestModule(t);
        });

        resetBtn.addEventListener("click", () => {
          stopTimer(t.id);
          remainingSeconds[t.id] = t.minutes * 60;
          timerEl.textContent = formatTime(remainingSeconds[t.id]);
          timerEl.classList.remove("live");
          createBtn.disabled = false;
          createBtn.textContent = "Create Test";
          noteEl.textContent = "Ready to start.";
          if (activeTest && activeTest.id === t.id) {
            closeTestModule();
          }
        });
      }
    }

    function buildTestQuestions(exam, test) {
      const prompts = [
        "Which option best explains the core concept here?",
        "Identify the most accurate statement.",
        "Choose the correct inference for this question.",
        "Which option is conceptually correct?"
      ];
      const output = [];
      for (let i = 0; i < 10; i += 1) {
        const correct = `${test.title}: correct principle ${i + 1} for ${exam}.`;
        const wrongA = `${test.title}: incorrect shortcut ${i + 1}.`;
        const wrongB = `${test.title}: unrelated assumption ${i + 1}.`;
        const wrongC = `${test.title}: misleading interpretation ${i + 1}.`;
        const choices = [correct, wrongA, wrongB, wrongC];
        const shuffled = choices.sort(() => Math.random() - 0.5);
        output.push({
          prompt: `${prompts[i % prompts.length]} (${exam} Test ${i + 1})`,
          choices: shuffled,
          answer: correct
        });
      }
      return output;
    }

    function renderModuleQuestion() {
      const q = moduleQuestions[moduleIndex];
      moduleSelectedChoice = null;
      moduleEvaluated = false;
      moduleProgress.textContent = `Question ${moduleIndex + 1} / ${moduleQuestions.length}`;
      moduleQuestion.textContent = q.prompt;
      moduleActionBtn.textContent = "Check Answer";
      moduleActionBtn.disabled = true;
      moduleOptions.innerHTML = "";
      q.choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "module-opt";
        btn.dataset.choice = choice;
        btn.innerHTML = `<span class="module-tag">${optionTags[idx] || idx + 1}</span><span>${choice}</span>`;
        btn.addEventListener("click", () => {
          if (moduleEvaluated) return;
          moduleSelectedChoice = choice;
          moduleActionBtn.disabled = false;
          Array.from(moduleOptions.children).forEach((node) => node.classList.remove("selected"));
          btn.classList.add("selected");
        });
        moduleOptions.appendChild(btn);
      });
    }

    function evaluateModuleAnswer() {
      if (!moduleSelectedChoice) return;
      moduleEvaluated = true;
      const q = moduleQuestions[moduleIndex];
      Array.from(moduleOptions.children).forEach((node) => {
        const isAnswer = node.dataset.choice === q.answer;
        const isSelected = node.dataset.choice === moduleSelectedChoice;
        if (isAnswer) node.classList.add("correct");
        if (isSelected && !isAnswer) node.classList.add("wrong");
      });
      moduleActionBtn.textContent = moduleIndex >= moduleQuestions.length - 1 ? "Finish Test" : "Next Question";
    }

    function nextModuleQuestion() {
      if (moduleIndex >= moduleQuestions.length - 1) {
        closeTestModule();
        return;
      }
      moduleIndex += 1;
      renderModuleQuestion();
    }

    function openTestModule(test) {
      activeTest = test;
      moduleTitle.textContent = test.title;
      moduleMeta.textContent = `${selectedExam} • ${test.syllabus} • 10 Questions`;
      moduleQuestions = buildTestQuestions(selectedExam, test);
      moduleIndex = 0;
      renderModuleQuestion();
      testModuleOverlay.classList.remove("hidden");
    }

    function closeTestModule() {
      testModuleOverlay.classList.add("hidden");
      activeTest = null;
      moduleQuestions = [];
      moduleIndex = 0;
      moduleSelectedChoice = null;
      moduleEvaluated = false;
      moduleOptions.innerHTML = "";
      moduleQuestion.textContent = "";
      moduleProgress.textContent = "Question 0 / 0";
    }

    async function init() {
      if (!api || !api.isConfigured()) {
        window.location.href = "index.html";
        return;
      }

      try {
        currentUser = await api.getCurrentUser();
      } catch {
        currentUser = null;
      }
      if (!currentUser) {
        window.location.href = "index.html";
        return;
      }

      welcomeText.textContent = `Signed in as ${currentUser.email || "user"}`;
      try {
        const onboarding = await api.getUserOnboarding(currentUser.id);
        const preferredExam = onboarding && typeof onboarding.exam_target === "string"
          ? onboarding.exam_target.trim().toUpperCase()
          : "";
        if (["JEE", "NEET", "UPSC"].includes(preferredExam)) {
          selectedExam = preferredExam;
        }
      } catch {}
      syncExamDropdown();
      renderTests();
    }

    examTrigger.addEventListener("click", () => {
      examMenu.classList.toggle("hidden");
      syncExamDropdown();
    });
    for (const option of examOptions) {
      option.addEventListener("click", () => {
        selectedExam = option.dataset.exam;
        closeExamMenu();
        renderTests();
      });
    }
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".exam-select-wrap")) {
        closeExamMenu();
      }
    });
    closeModuleBtn.addEventListener("click", closeTestModule);
    testModuleOverlay.addEventListener("click", (event) => {
      if (event.target === testModuleOverlay) closeTestModule();
    });
    moduleActionBtn.addEventListener("click", () => {
      if (!moduleEvaluated) evaluateModuleAnswer();
      else nextModuleQuestion();
    });
    goStudyBtn.addEventListener("click", () => {
      window.location.href = "index.html";
    });
    goPracticeBtn.addEventListener("click", () => {
      window.location.href = "practice-hub.html";
    });
    logoutBtn.addEventListener("click", async () => {
      try {
        await api.signOut();
      } catch {}
      window.location.href = "index.html";
    });

    init();
  </script>
</body>
</html>
