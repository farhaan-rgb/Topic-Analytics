<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Series - Teachmint</title>
  <style>
    :root {
      --text: #f2f4ff;
      --muted: #99a0bc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% -5%, #203066 0%, transparent 45%),
        linear-gradient(160deg, #07080f 0%, #0a0d1a 60%, #080a13 100%);
      min-height: 100vh;
      padding-bottom: 86px;
    }
    .hidden { display: none !important; }
    .app-wrap {
      width: min(600px, 94vw);
      margin: 1.1rem auto;
    }
    .panel {
      background: linear-gradient(150deg, rgba(22, 24, 38, 0.95), rgba(15, 17, 27, 0.95));
      border: 1px solid #252a3a;
      border-radius: 16px;
      padding: 1rem;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.75rem;
    }
    .brand-row { display: flex; align-items: center; gap: 0.65rem; }
    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(160deg, #2cc2ff, #0f8dcc);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(24, 181, 255, 0.35);
    }
    .brand-logo svg { width: 25px; height: 25px; }
    h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2rem); }
    .welcome { color: var(--muted); font-size: 0.88rem; margin-top: 0.15rem; }
    .logout-btn {
      border: 1px solid #3a405a;
      background: #21263a;
      color: #f2f4ff;
      border-radius: 12px;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .exam-shell {
      border: 1px solid #2f3a56;
      border-radius: 12px;
      background: linear-gradient(155deg, #171f34, #13192a);
      padding: 0.58rem 0.65rem;
      margin-bottom: 0.7rem;
    }
    .exam-label {
      font-size: 0.77rem;
      color: #8ea1cb;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.34rem;
      font-weight: 600;
    }
    .select-wrap { position: relative; }
    .select-trigger {
      width: 100%;
      border: 1px solid #3f4f77;
      border-radius: 11px;
      background: #1b2642;
      color: #eef3ff;
      padding: 0.66rem 2rem 0.66rem 0.72rem;
      font: inherit;
      text-align: left;
      cursor: pointer;
      position: relative;
    }
    .select-trigger::after {
      content: "";
      position: absolute;
      right: 0.68rem;
      top: 50%;
      width: 0.46rem;
      height: 0.46rem;
      border-right: 2px solid #9cb2de;
      border-bottom: 2px solid #9cb2de;
      transform: translateY(-65%) rotate(45deg);
      opacity: 0.9;
    }
    .select-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 0.38rem);
      z-index: 8;
      border: 1px solid #425585;
      border-radius: 11px;
      background: #182238;
      padding: 0.25rem;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.34);
    }
    .select-option {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #eaf0ff;
      text-align: left;
      padding: 0.48rem 0.5rem;
      font: inherit;
      cursor: pointer;
    }
    .select-option:hover,
    .select-option.active {
      background: #243458;
      color: #fff;
    }

    .custom-bar {
      margin-bottom: 0.85rem;
    }
    .custom-btn {
      width: 100%;
      border: 1px solid #2f9bf0;
      border-radius: 11px;
      background: linear-gradient(135deg, #2f9bf0, #2377bc);
      color: #fff;
      padding: 0.58rem 0.72rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .tests-list {
      display: grid;
      gap: 0.75rem;
    }
    .test-card {
      border: 1px solid #2d3857;
      border-radius: 13px;
      background: linear-gradient(155deg, rgba(31, 42, 67, 0.93), rgba(20, 28, 44, 0.93));
      padding: 0.75rem;
    }
    .test-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.7rem;
    }
    .test-title { margin: 0; font-size: 1rem; line-height: 1.25; }
    .test-meta {
      margin-top: 0.28rem;
      color: #a9b5d7;
      font-size: 0.84rem;
      line-height: 1.3;
    }
    .test-stats {
      margin-top: 0.38rem;
      color: #d1dcff;
      font-size: 0.82rem;
      line-height: 1.2;
    }
    .timer-pill {
      border: 1px solid #3f5e8e;
      border-radius: 999px;
      padding: 0.25rem 0.56rem;
      color: #cbe4ff;
      background: #17335a;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .test-actions {
      margin-top: 0.68rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    .test-btn {
      border: 1px solid #2f9bf0;
      border-radius: 10px;
      background: linear-gradient(135deg, #2f9bf0, #2377bc);
      color: #fff;
      padding: 0.44rem 0.72rem;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }
    .test-btn.ghost {
      border: 1px solid #4c5e88;
      background: #1a2742;
      color: #dfe8ff;
    }

    .custom-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(5, 7, 12, 0.74);
      display: grid;
      place-items: center;
      padding: 0.9rem;
    }
    .custom-modal {
      width: min(620px, 96vw);
      max-height: min(92vh, 760px);
      overflow: auto;
      border: 1px solid #304a7a;
      border-radius: 14px;
      background: linear-gradient(160deg, #141d33, #0f1628);
      padding: 0.9rem;
    }
    .custom-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.7rem;
    }
    .custom-title { margin: 0; font-size: 1.08rem; }
    .close-custom {
      border: 1px solid #445682;
      background: #1f2a45;
      color: #eff4ff;
      border-radius: 10px;
      padding: 0.32rem 0.54rem;
      font: inherit;
      cursor: pointer;
      font-size: 0.86rem;
    }
    .grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .full { grid-column: 1 / -1; }
    label {
      display: block;
      color: #dce4ff;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }

    .duration-wrap {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: 0.42rem;
      align-items: center;
    }
    .dur-btn {
      border: 1px solid #3f4f77;
      background: linear-gradient(155deg, #1b2642, #182137);
      color: #eaf0ff;
      border-radius: 10px;
      height: 42px;
      font: inherit;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .dur-btn:hover {
      border-color: #59bdfc;
      transform: translateY(-1px);
    }
    .dur-btn span {
      font-size: 1.2rem;
      line-height: 1;
      color: #b6ccf2;
      transform: translateY(-1px);
    }
    .dur-input {
      width: 100%;
      border: 1px solid #4a5d93;
      border-radius: 10px;
      background: linear-gradient(160deg, #202c4c, #1c2643);
      color: #f2f6ff;
      padding: 0.66rem 0.68rem;
      font: inherit;
      text-align: center;
      appearance: textfield;
      -moz-appearance: textfield;
      font-weight: 600;
    }
    .dur-input::-webkit-outer-spin-button,
    .dur-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .pick-box {
      border: 1px solid #304064;
      border-radius: 11px;
      padding: 0.42rem;
      background: linear-gradient(160deg, #17243f, #141f35);
      max-height: 190px;
      overflow: auto;
      display: grid;
      gap: 0.45rem;
    }
    .pick-empty {
      border: 1px solid #3a4e79;
      border-radius: 9px;
      background: #1b2742;
      color: #a8b7da;
      padding: 0.54rem 0.6rem;
      font-size: 0.84rem;
    }
    .pick-option {
      width: 100%;
      border: 1px solid #3d517f;
      border-radius: 10px;
      background: #1c2743;
      color: #e7ecff;
      padding: 0.5rem 0.6rem;
      text-align: left;
      font: inherit;
      font-size: 0.84rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      transition: border-color 0.16s ease, background 0.16s ease;
    }
    .pick-option:hover {
      border-color: #58bbfb;
    }
    .pick-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pick-state {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1px solid #49608f;
      background: #223253;
      color: transparent;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .pick-option.active {
      border-color: #4ac0ff;
      background: linear-gradient(160deg, #234a75, #1f4067);
      box-shadow: inset 0 0 0 1px rgba(77, 193, 255, 0.3);
    }
    .pick-option.active .pick-state {
      border-color: #8ee2ff;
      background: #2a6b95;
      color: #eefbff;
    }

    .custom-actions {
      margin-top: 0.9rem;
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    .btn-ghost {
      border: 1px solid #485d8f;
      border-radius: 10px;
      background: #1c2742;
      color: #eef4ff;
      padding: 0.5rem 0.72rem;
      font: inherit;
      cursor: pointer;
    }
    .btn-primary {
      border: 1px solid #2f9bf0;
      border-radius: 10px;
      background: linear-gradient(135deg, #2f9bf0, #2377bc);
      color: #fff;
      padding: 0.5rem 0.72rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .custom-status {
      margin-top: 0.62rem;
      min-height: 1rem;
      font-size: 0.84rem;
      color: #ff9cbb;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      border-top: 1px solid #2d3551;
      background: rgba(10, 14, 24, 0.97);
      backdrop-filter: blur(6px);
      padding: 0.55rem 0.8rem calc(0.55rem + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.6rem;
    }
    .bottom-btn {
      border: 1px solid #3a4260;
      border-radius: 12px;
      background: #1a2237;
      color: #dbe4ff;
      padding: 0.62rem 0.5rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .bottom-btn.active {
      border-color: #2aa8f4;
      background: #223d63;
      color: #eff6ff;
      box-shadow: inset 0 0 0 1px rgba(47, 155, 240, 0.35);
    }
  </style>
</head>
<body>
  <main class="app-wrap">
    <section class="panel">
      <div class="topbar">
        <div>
          <div class="brand-row">
            <div class="brand-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 7.5L12 3l9 4.5-9 4.5L3 7.5Z" fill="#E7F8FF" opacity=".95"/>
                <path d="M3 11.6 12 16l9-4.4" stroke="#D6F2FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 7.2v11.2" stroke="#0C5E8D" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </div>
            <h1>Teachmint</h1>
          </div>
          <div id="welcomeText" class="welcome">Test Series</div>
        </div>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </div>

      <div class="exam-shell">
        <div class="exam-label">Exam</div>
        <div class="select-wrap" id="examSelectWrap">
          <button id="examTrigger" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">JEE</button>
          <div id="examMenu" class="select-menu hidden" role="listbox" aria-label="Select exam">
            <button class="select-option" data-exam="JEE" type="button">JEE</button>
          </div>
        </div>
      </div>

      <div class="custom-bar">
        <button id="openCustomBtn" class="custom-btn" type="button">Create Custom Mock Test</button>
      </div>

      <div id="testsList" class="tests-list"></div>
    </section>
  </main>

  <div id="customOverlay" class="custom-overlay hidden">
    <div class="custom-modal">
      <div class="custom-head">
        <h3 class="custom-title">Create Custom Mock Test</h3>
        <button id="closeCustomBtn" class="close-custom" type="button">Close</button>
      </div>
      <div class="grid">
        <div>
          <label for="customDuration">Duration (minutes)</label>
          <div class="duration-wrap">
            <button id="decDurationBtn" class="dur-btn" type="button" aria-label="Decrease duration"><span aria-hidden="true">‹</span></button>
            <input id="customDuration" class="dur-input" type="number" min="10" max="300" step="5" value="60" />
            <button id="incDurationBtn" class="dur-btn" type="button" aria-label="Increase duration"><span aria-hidden="true">›</span></button>
          </div>
        </div>
        <div>
          <label>Level</label>
          <div class="select-wrap" id="levelSelectWrap">
            <button id="levelTrigger" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">Easy</button>
            <div id="levelMenu" class="select-menu hidden" role="listbox" aria-label="Select level">
              <button class="select-option" data-level="Easy" type="button">Easy</button>
              <button class="select-option" data-level="Medium" type="button">Medium</button>
              <button class="select-option" data-level="Hard" type="button">Hard</button>
            </div>
          </div>
        </div>
        <div class="full">
          <label>Subjects</label>
          <div id="subjectsBox" class="pick-box"></div>
        </div>
        <div class="full">
          <label>Chapters</label>
          <div id="chaptersBox" class="pick-box"></div>
        </div>
      </div>
      <div id="customStatus" class="custom-status"></div>
      <div class="custom-actions">
        <button id="cancelCustomBtn" class="btn-ghost" type="button">Cancel</button>
        <button id="createCustomBtn" class="btn-primary" type="button">Create</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Bottom navigation">
    <button id="goStudyBtn" class="bottom-btn" type="button">Study Materials</button>
    <button id="goPracticeBtn" class="bottom-btn" type="button">Practice</button>
    <button class="bottom-btn active" type="button">Test Series</button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="curriculum-data.js"></script>
  <script>
    const api = window.teachmintApi;

    const examTrigger = document.getElementById("examTrigger");
    const examMenu = document.getElementById("examMenu");
    const examOptions = Array.from(document.querySelectorAll("#examMenu .select-option"));
    const examSelectWrap = document.getElementById("examSelectWrap");

    const testsList = document.getElementById("testsList");
    const welcomeText = document.getElementById("welcomeText");
    const logoutBtn = document.getElementById("logoutBtn");
    const goStudyBtn = document.getElementById("goStudyBtn");
    const goPracticeBtn = document.getElementById("goPracticeBtn");

    const openCustomBtn = document.getElementById("openCustomBtn");
    const customOverlay = document.getElementById("customOverlay");
    const closeCustomBtn = document.getElementById("closeCustomBtn");
    const cancelCustomBtn = document.getElementById("cancelCustomBtn");
    const createCustomBtn = document.getElementById("createCustomBtn");

    const customDuration = document.getElementById("customDuration");
    const decDurationBtn = document.getElementById("decDurationBtn");
    const incDurationBtn = document.getElementById("incDurationBtn");

    const levelTrigger = document.getElementById("levelTrigger");
    const levelMenu = document.getElementById("levelMenu");
    const levelOptions = Array.from(document.querySelectorAll("#levelMenu .select-option"));
    const levelSelectWrap = document.getElementById("levelSelectWrap");

    const subjectsBox = document.getElementById("subjectsBox");
    const chaptersBox = document.getElementById("chaptersBox");
    const customStatus = document.getElementById("customStatus");

    const STATS_STORAGE_KEY = "teachmint_test_stats_v2";
    const CUSTOM_TESTS_STORAGE_KEY = "teachmint_custom_tests_v1";

    const defaultStats = {
      "JEE:jee-1": { completed: 1240, rating_sum: 5230, rating_count: 1320 },
      "JEE:jee-2": { completed: 890, rating_sum: 3660, rating_count: 940 },
      "JEE:jee-3": { completed: 640, rating_sum: 2590, rating_count: 700 }
    };

    const testTemplates = {
      JEE: [
        { id: "jee-1", title: "JEE Mock Test 1", syllabus: "Maths + Physics + Chemistry", questions: 90, minutes: 180, isCustom: false },
        { id: "jee-2", title: "JEE Mock Test 2", syllabus: "Core Concepts Revision", questions: 75, minutes: 150, isCustom: false },
        { id: "jee-3", title: "JEE Speed Test", syllabus: "Mixed High-Weightage Topics", questions: 45, minutes: 60, isCustom: false }
      ]
    };

    let currentUser = null;
    let selectedExam = "JEE";
    let selectedLevel = "Easy";
    let statsByKey = loadStats();
    let customTestsByExam = loadCustomTests();
    let selectedSubjects = new Set();
    let selectedChapters = new Set();

    function loadStats() {
      let parsed = null;
      try {
        parsed = JSON.parse(localStorage.getItem(STATS_STORAGE_KEY) || "null");
      } catch {}
      const out = Object.assign({}, defaultStats, parsed && typeof parsed === "object" ? parsed : {});
      localStorage.setItem(STATS_STORAGE_KEY, JSON.stringify(out));
      return out;
    }

    function loadCustomTests() {
      let parsed = null;
      try {
        parsed = JSON.parse(localStorage.getItem(CUSTOM_TESTS_STORAGE_KEY) || "null");
      } catch {}
      const base = { JEE: [] };
      if (parsed && typeof parsed === "object") {
        for (const exam of ["JEE"]) {
          base[exam] = Array.isArray(parsed[exam]) ? parsed[exam] : [];
        }
      }
      return base;
    }

    function persistCustomTests() {
      localStorage.setItem(CUSTOM_TESTS_STORAGE_KEY, JSON.stringify(customTestsByExam));
    }

    function statsFor(key) {
      const row = statsByKey[key] || { completed: 0, rating_sum: 0, rating_count: 0 };
      return {
        completed: Number(row.completed) || 0,
        ratingSum: Number(row.rating_sum) || 0,
        ratingCount: Number(row.rating_count) || 0
      };
    }

    function formatStars(avg) {
      const safe = Number.isFinite(avg) ? avg : 0;
      const rounded = Math.round(safe);
      const full = "★".repeat(Math.max(0, Math.min(5, rounded)));
      const empty = "☆".repeat(5 - Math.max(0, Math.min(5, rounded)));
      return `${full}${empty} ${safe.toFixed(1)}`;
    }

    function syncExamDropdown() {
      examTrigger.textContent = selectedExam;
      examTrigger.setAttribute("aria-expanded", examMenu.classList.contains("hidden") ? "false" : "true");
      for (const option of examOptions) {
        option.classList.toggle("active", option.dataset.exam === selectedExam);
      }
    }

    function closeExamMenu() {
      examMenu.classList.add("hidden");
      syncExamDropdown();
    }

    function syncLevelDropdown() {
      levelTrigger.textContent = selectedLevel;
      levelTrigger.setAttribute("aria-expanded", levelMenu.classList.contains("hidden") ? "false" : "true");
      for (const option of levelOptions) {
        option.classList.toggle("active", option.dataset.level === selectedLevel);
      }
    }

    function closeLevelMenu() {
      levelMenu.classList.add("hidden");
      syncLevelDropdown();
    }

    function updateDuration(delta) {
      const current = Number(customDuration.value) || 60;
      const next = Math.max(10, Math.min(300, current + delta));
      customDuration.value = String(next);
    }

    function openCustomModal() {
      selectedSubjects = new Set();
      selectedChapters = new Set();
      selectedLevel = "Easy";
      customDuration.value = "60";
      customStatus.textContent = "";
      syncLevelDropdown();
      renderSubjects();
      renderChapters();
      customOverlay.classList.remove("hidden");
    }

    function closeCustomModal() {
      customOverlay.classList.add("hidden");
    }

    function curriculumMap() {
      const source = window.curriculumData && window.curriculumData.catalog ? window.curriculumData.catalog : {};
      return source && typeof source[selectedExam] === "object" ? source[selectedExam] : {};
    }

    function renderSubjects() {
      const map = curriculumMap();
      subjectsBox.innerHTML = "";
      const subjects = Object.keys(map);
      if (!subjects.length) {
        const div = document.createElement("div");
        div.className = "pick-option";
        div.textContent = "No subjects available.";
        div.style.cursor = "default";
        subjectsBox.appendChild(div);
        return;
      }
      for (const subject of subjects) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `pick-option ${selectedSubjects.has(subject) ? "active" : ""}`.trim();
        btn.textContent = subject;
        btn.addEventListener("click", () => {
          if (selectedSubjects.has(subject)) selectedSubjects.delete(subject);
          else selectedSubjects.add(subject);
          renderSubjects();
          renderChapters();
        });
        subjectsBox.appendChild(btn);
      }
    }

    function chapterPool() {
      const map = curriculumMap();
      const out = [];
      for (const subject of selectedSubjects) {
        const chapters = Array.isArray(map[subject]) ? map[subject] : [];
        for (const chapter of chapters) {
          out.push({ subject, chapter, key: `${subject}::${chapter}` });
        }
      }
      return out;
    }

    function renderChapters() {
      const pool = chapterPool();
      const allowed = new Set(pool.map((p) => p.key));
      for (const key of [...selectedChapters]) {
        if (!allowed.has(key)) selectedChapters.delete(key);
      }

      chaptersBox.innerHTML = "";
      if (!pool.length) {
        const div = document.createElement("div");
        div.className = "pick-option";
        div.textContent = "Select subject(s) first.";
        div.style.cursor = "default";
        chaptersBox.appendChild(div);
        return;
      }
      for (const item of pool) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `pick-option ${selectedChapters.has(item.key) ? "active" : ""}`.trim();
        btn.textContent = `${item.subject} - ${item.chapter}`;
        btn.addEventListener("click", () => {
          if (selectedChapters.has(item.key)) selectedChapters.delete(item.key);
          else selectedChapters.add(item.key);
          renderChapters();
        });
        chaptersBox.appendChild(btn);
      }
    }

    function renderTests() {
      const fixed = Array.isArray(testTemplates[selectedExam]) ? testTemplates[selectedExam] : [];
      const custom = Array.isArray(customTestsByExam[selectedExam]) ? customTestsByExam[selectedExam] : [];
      const tests = [...fixed, ...custom];
      testsList.innerHTML = "";

      for (const t of tests) {
        const statsKey = t.statsKey || `${selectedExam}:${t.id}`;
        const s = statsFor(statsKey);
        const avg = s.ratingCount ? s.ratingSum / s.ratingCount : 0;

        const card = document.createElement("article");
        card.className = "test-card";
        card.innerHTML = `
          <div class="test-head">
            <div>
              <h3 class="test-title">${t.title}</h3>
              <div class="test-meta">${t.syllabus}</div>
              <div class="test-meta">${t.questions} questions • ${t.minutes} mins</div>
              <div class="test-stats">Completed by ${s.completed} learners • ${formatStars(avg)} (${s.ratingCount})</div>
            </div>
            <div class="timer-pill">${String(t.minutes).padStart(2, "0")}:00</div>
          </div>
          <div class="test-actions">
            <button class="test-btn" type="button" id="create-${t.id}">Create Questions</button>
            ${t.isCustom ? "" : `<button class="test-btn ghost" type="button" id="leader-${t.id}">Leaderboard</button>`}
          </div>
        `;
        testsList.appendChild(card);

        card.querySelector(`#create-${t.id}`).addEventListener("click", () => {
          const subjectsText = Array.isArray(t.subjects) ? t.subjects.join("|") : "";
          const chaptersText = Array.isArray(t.chapters) ? t.chapters.join("|") : "";
          const levelText = t.level ? String(t.level) : "";
          const url = `test-attempt.html?exam=${encodeURIComponent(selectedExam)}&test_id=${encodeURIComponent(t.id)}&title=${encodeURIComponent(t.title)}&syllabus=${encodeURIComponent(t.syllabus)}&count=${encodeURIComponent(String(t.questions))}&minutes=${encodeURIComponent(String(t.minutes))}&stats_key=${encodeURIComponent(statsKey)}&level=${encodeURIComponent(levelText)}&subjects=${encodeURIComponent(subjectsText)}&chapters=${encodeURIComponent(chaptersText)}&is_custom=${t.isCustom ? "1" : "0"}&user=${encodeURIComponent(currentUser && currentUser.email ? currentUser.email : "Learner")}`;
          window.location.href = url;
        });

        if (!t.isCustom) {
          card.querySelector(`#leader-${t.id}`).addEventListener("click", () => {
            const url = `test-leaderboard.html?exam=${encodeURIComponent(selectedExam)}&test_id=${encodeURIComponent(t.id)}&title=${encodeURIComponent(t.title)}&stats_key=${encodeURIComponent(statsKey)}`;
            window.location.href = url;
          });
        }
      }
    }

    async function init() {
      if (!api || !api.isConfigured()) {
        window.location.href = "index.html";
        return;
      }
      try {
        currentUser = await api.getCurrentUser();
      } catch {
        currentUser = null;
      }
      if (!currentUser) {
        window.location.href = "index.html";
        return;
      }

      welcomeText.textContent = `Signed in as ${currentUser.email || "user"}`;
      try {
        const onboarding = await api.getUserOnboarding(currentUser.id);
        const preferredExam = onboarding && typeof onboarding.exam_target === "string"
          ? onboarding.exam_target.trim().toUpperCase()
          : "";
        if (preferredExam === "JEE") {
          selectedExam = preferredExam;
        }
      } catch {}

      syncExamDropdown();
      syncLevelDropdown();
      renderTests();
    }

    examTrigger.addEventListener("click", () => {
      examMenu.classList.toggle("hidden");
      syncExamDropdown();
    });
    for (const option of examOptions) {
      option.addEventListener("click", () => {
        selectedExam = option.dataset.exam;
        closeExamMenu();
        renderTests();
      });
    }

    levelTrigger.addEventListener("click", () => {
      levelMenu.classList.toggle("hidden");
      syncLevelDropdown();
    });
    for (const option of levelOptions) {
      option.addEventListener("click", () => {
        selectedLevel = option.dataset.level;
        closeLevelMenu();
      });
    }

    document.addEventListener("click", (event) => {
      if (!event.target.closest("#examSelectWrap")) closeExamMenu();
      if (!event.target.closest("#levelSelectWrap")) closeLevelMenu();
    });

    openCustomBtn.addEventListener("click", openCustomModal);
    closeCustomBtn.addEventListener("click", closeCustomModal);
    cancelCustomBtn.addEventListener("click", closeCustomModal);
    customOverlay.addEventListener("click", (event) => {
      if (event.target === customOverlay) closeCustomModal();
    });

    decDurationBtn.addEventListener("click", () => updateDuration(-5));
    incDurationBtn.addEventListener("click", () => updateDuration(5));

    createCustomBtn.addEventListener("click", () => {
      customStatus.textContent = "";
      const duration = Math.max(10, Math.min(300, Number(customDuration.value) || 0));
      if (!selectedSubjects.size) {
        customStatus.textContent = "Select at least one subject.";
        return;
      }
      if (!selectedChapters.size) {
        customStatus.textContent = "Select at least one chapter.";
        return;
      }

      const subjects = [...selectedSubjects];
      const chapterPairs = [...selectedChapters].map((key) => {
        const idx = key.indexOf("::");
        return idx >= 0 ? key.slice(idx + 2) : key;
      });

      const customId = `custom-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
      const existing = Array.isArray(customTestsByExam[selectedExam]) ? customTestsByExam[selectedExam] : [];
      const title = `Custom Mock ${existing.length + 1}`;
      const qCount = Math.max(10, Math.min(200, Math.round(duration * 0.8)));
      const syllabus = `${selectedLevel} • ${subjects.join(", ")} • ${chapterPairs.slice(0, 3).join(", ")}${chapterPairs.length > 3 ? "..." : ""}`;
      const statsKey = `${selectedExam}:${customId}`;

      customTestsByExam[selectedExam] = [
        {
          id: customId,
          title,
          syllabus,
          questions: qCount,
          minutes: duration,
          level: selectedLevel,
          subjects,
          chapters: chapterPairs,
          statsKey,
          isCustom: true
        },
        ...existing
      ];

      if (!statsByKey[statsKey]) {
        statsByKey[statsKey] = { completed: 0, rating_sum: 0, rating_count: 0 };
      }

      localStorage.setItem(STATS_STORAGE_KEY, JSON.stringify(statsByKey));
      persistCustomTests();
      closeCustomModal();
      renderTests();
    });

    goStudyBtn.addEventListener("click", () => {
      window.location.href = "index.html";
    });
    goPracticeBtn.addEventListener("click", () => {
      window.location.href = "practice-hub.html";
    });
    logoutBtn.addEventListener("click", async () => {
      try {
        await api.signOut();
      } catch {}
      window.location.href = "index.html";
    });

    init();
  </script>
</body>
</html>
