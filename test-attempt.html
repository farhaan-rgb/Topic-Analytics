<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Test - Teachmint</title>
  <style>
    :root {
      --bg-top: #123055;
      --bg-main: #08111f;
      --option: #26384c;
      --option-border: #3b4f66;
      --text: #eef3ff;
      --muted: #a8b5ca;
      --ok: #4ad69f;
      --bad: #ff7fa3;
      --btn: #2a7ac2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-top) 0%, #0d213a 32%, var(--bg-main) 100%);
      min-height: 100vh;
      padding: 0.9rem;
    }
    .container { width: min(760px, 96vw); margin: 0 auto; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.85rem;
    }
    .back {
      border: 1px solid #4a6380;
      background: rgba(16, 34, 56, 0.85);
      color: #eef4ff;
      border-radius: 11px;
      padding: 0.5rem 0.72rem;
      text-decoration: none;
      font-size: 0.92rem;
    }
    .progress {
      color: #c7d5e9;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      text-align: right;
    }
    .timer-line {
      margin-top: 0.24rem;
      color: #9fd2ff;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .topic {
      border: 1px solid rgba(167, 196, 228, 0.2);
      background: linear-gradient(180deg, rgba(29, 66, 106, 0.85), rgba(21, 47, 75, 0.85));
      border-radius: 14px;
      padding: 0.95rem;
      margin-bottom: 0.95rem;
    }
    .topic h1 { margin: 0; font-size: clamp(1.2rem, 4.1vw, 1.75rem); line-height: 1.25; }
    .topic .meta { margin-top: 0.35rem; color: var(--muted); font-size: 0.9rem; }
    .q-text {
      margin: 0 0 0.95rem;
      font-size: clamp(1.35rem, 4.4vw, 2.05rem);
      font-weight: 600;
      line-height: 1.27;
      color: #f6f8ff;
    }
    .options { display: grid; gap: 0.72rem; }
    .opt {
      width: 100%;
      text-align: left;
      border: 1px solid var(--option-border);
      border-radius: 13px;
      background: var(--option);
      color: #edf2ff;
      padding: 0.78rem 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.72rem;
    }
    .opt-tag {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #41566e;
      color: #ecf3ff;
      display: grid;
      place-items: center;
      font-weight: 700;
      flex-shrink: 0;
    }
    .opt.correct { border-color: var(--ok); background: #20483f; }
    .opt.wrong { border-color: var(--bad); background: #4a2734; }
    .opt.selected { border-color: #8ec3ff; background: #30465e; }
    .opt.correct.selected { border-color: var(--ok); background: #20483f; }
    .opt.wrong.selected { border-color: var(--bad); background: #4a2734; }
    .footer { margin-top: 1rem; display: flex; justify-content: center; }
    .action {
      border: 0;
      border-radius: 10px;
      padding: 0.55rem 0.85rem;
      cursor: pointer;
      background: var(--btn);
      color: white;
      font-weight: 600;
    }
    .action:disabled { opacity: 0.55; cursor: not-allowed; }
    .empty {
      border: 1px solid rgba(167, 196, 228, 0.2);
      border-radius: 14px;
      padding: 1rem;
      background: rgba(25, 49, 78, 0.55);
      color: #dbe5f8;
      text-align: center;
    }
    .result-actions {
      margin-top: 0.8rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .rating-wrap {
      margin-top: 0.8rem;
      border-top: 1px solid rgba(160, 190, 236, 0.22);
      padding-top: 0.7rem;
      text-align: center;
    }
    .rating-title {
      color: #d8e6ff;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    .stars {
      display: flex;
      justify-content: center;
      gap: 0.2rem;
    }
    .star-btn {
      border: 0;
      background: transparent;
      color: #6f86b6;
      font-size: 1.45rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.1rem;
    }
    .star-btn.active { color: #ffd761; }
    .rating-submit {
      margin-top: 0.5rem;
      border: 1px solid #2f9bf0;
      border-radius: 10px;
      background: linear-gradient(135deg, #2f9bf0, #2377bc);
      color: #fff;
      padding: 0.42rem 0.72rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .rating-note {
      margin-top: 0.35rem;
      min-height: 1rem;
      color: #9fd2ff;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="top">
      <a id="backBtn" class="back" href="test-series.html">Back</a>
      <div class="progress">
        <div id="progress">Question 0 / 0</div>
        <div id="timerLine" class="timer-line">Time left 00:00</div>
      </div>
    </div>

    <section class="topic">
      <h1 id="title">Loading...</h1>
      <div id="meta" class="meta"></div>
    </section>

    <section id="quiz">
      <p id="questionText" class="q-text"></p>
      <div id="options" class="options"></div>
      <div class="footer">
        <button id="actionBtn" class="action" type="button" disabled>Check Answer</button>
      </div>
    </section>

    <section id="empty" class="empty" style="display:none;"></section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const exam = (params.get("exam") || "JEE").trim().toUpperCase();
    const testId = (params.get("test_id") || "mock").trim();
    const testTitle = (params.get("title") || "Mock Test").trim();
    const syllabus = (params.get("syllabus") || "").trim();
    const count = Math.max(1, Number(params.get("count")) || 10);
    const minutes = Math.max(1, Number(params.get("minutes")) || 60);
    const statsKey = (params.get("stats_key") || "").trim();
    const isCustom = params.get("is_custom") === "1";
    const userName = (params.get("user") || "Learner").trim();

    const titleEl = document.getElementById("title");
    const metaEl = document.getElementById("meta");
    const progressEl = document.getElementById("progress");
    const timerLineEl = document.getElementById("timerLine");
    const questionTextEl = document.getElementById("questionText");
    const optionsEl = document.getElementById("options");
    const actionBtn = document.getElementById("actionBtn");
    const quizEl = document.getElementById("quiz");
    const emptyEl = document.getElementById("empty");
    const backBtn = document.getElementById("backBtn");

    const optionTags = ["A", "B", "C", "D", "E", "F"];
    const prompts = [
      "Which option best explains the core concept here?",
      "Identify the most accurate statement.",
      "Choose the correct inference for this question.",
      "Which option is conceptually correct?"
    ];

    let questions = [];
    let index = 0;
    let selectedChoice = null;
    let evaluated = false;
    let remainingSeconds = minutes * 60;
    let timerHandle = null;
    let completionSaved = false;
    let ratingSaved = false;
    let selectedRating = 0;
    let correctCount = 0;

    function showEmpty(msg) {
      quizEl.style.display = "none";
      emptyEl.style.display = "block";
      emptyEl.textContent = msg;
      progressEl.textContent = `Question 0 / ${questions.length || 0}`;
    }

    function formatTime(totalSec) {
      const sec = Math.max(0, Number(totalSec) || 0);
      const mm = String(Math.floor(sec / 60)).padStart(2, "0");
      const ss = String(sec % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function shuffle(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildQuestions(total) {
      const out = [];
      for (let i = 0; i < total; i += 1) {
        const correct = `${testTitle}: correct principle ${i + 1} for ${exam}.`;
        const choices = shuffle([
          correct,
          `${testTitle}: incorrect shortcut ${i + 1}.`,
          `${testTitle}: unrelated assumption ${i + 1}.`,
          `${testTitle}: misleading interpretation ${i + 1}.`
        ]);
        out.push({
          prompt: `${prompts[i % prompts.length]} (${exam} ${testId.toUpperCase()} • Q${i + 1})`,
          choices,
          answer: correct
        });
      }
      return out;
    }

    function renderQuestion() {
      const q = questions[index];
      selectedChoice = null;
      evaluated = false;
      progressEl.textContent = `Question ${index + 1} / ${questions.length}`;
      questionTextEl.textContent = q.prompt;
      actionBtn.textContent = "Check Answer";
      actionBtn.disabled = true;
      optionsEl.innerHTML = "";

      q.choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt";
        btn.dataset.choice = choice;
        btn.innerHTML = `<span class="opt-tag">${optionTags[idx] || idx + 1}</span><span>${choice}</span>`;
        btn.addEventListener("click", () => {
          if (evaluated) return;
          selectedChoice = choice;
          actionBtn.disabled = false;
          Array.from(optionsEl.children).forEach((node) => node.classList.remove("selected"));
          btn.classList.add("selected");
        });
        optionsEl.appendChild(btn);
      });
    }

    function evaluate() {
      if (!selectedChoice) return;
      evaluated = true;
      const q = questions[index];
      if (selectedChoice === q.answer) correctCount += 1;
      Array.from(optionsEl.children).forEach((node) => {
        const isAnswer = node.dataset.choice === q.answer;
        const isSelected = node.dataset.choice === selectedChoice;
        node.classList.remove("selected");
        if (isAnswer) node.classList.add("correct");
        if (isSelected && !isAnswer) node.classList.add("wrong");
      });
      actionBtn.textContent = index >= questions.length - 1 ? "Finish Test" : "Next Question";
    }

    function persistCompletion() {
      if (completionSaved || !statsKey) return;
      completionSaved = true;
      try {
        const statsStore = "teachmint_test_stats_v2";
        const statsRaw = JSON.parse(localStorage.getItem(statsStore) || "{}");
        const row = statsRaw && typeof statsRaw[statsKey] === "object" ? statsRaw[statsKey] : {};
        statsRaw[statsKey] = {
          completed: (Number(row.completed) || 0) + 1,
          rating_sum: Number(row.rating_sum) || 0,
          rating_count: Number(row.rating_count) || 0
        };
        localStorage.setItem(statsStore, JSON.stringify(statsRaw));

        if (!isCustom) {
          const lbStore = "teachmint_test_leaderboard_v1";
          const lbRaw = JSON.parse(localStorage.getItem(lbStore) || "{}");
          const arr = Array.isArray(lbRaw[statsKey]) ? lbRaw[statsKey] : [];
          arr.push({
            name: userName || "Learner",
            score: correctCount,
            total: questions.length,
            at: Date.now()
          });
          arr.sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));
          lbRaw[statsKey] = arr.slice(0, 100);
          localStorage.setItem(lbStore, JSON.stringify(lbRaw));
        }
      } catch {}
    }

    function renderRatingUI() {
      if (ratingSaved || !statsKey) return;
      const wrap = document.createElement("div");
      wrap.className = "rating-wrap";
      wrap.innerHTML = `
        <div class="rating-title">Rate this mock test</div>
        <div class="stars" id="stars"></div>
        <button id="submitRating" class="rating-submit" type="button">Submit Rating</button>
        <div id="ratingNote" class="rating-note"></div>
      `;
      emptyEl.appendChild(wrap);

      const stars = wrap.querySelector("#stars");
      const note = wrap.querySelector("#ratingNote");
      for (let i = 1; i <= 5; i += 1) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "star-btn";
        btn.textContent = "★";
        btn.addEventListener("click", () => {
          selectedRating = i;
          const all = stars.querySelectorAll(".star-btn");
          all.forEach((node, idx) => node.classList.toggle("active", idx < i));
        });
        stars.appendChild(btn);
      }

      wrap.querySelector("#submitRating").addEventListener("click", () => {
        if (ratingSaved) return;
        if (!selectedRating) {
          note.textContent = "Select a rating first.";
          return;
        }
        try {
          const statsStore = "teachmint_test_stats_v2";
          const statsRaw = JSON.parse(localStorage.getItem(statsStore) || "{}");
          const row = statsRaw && typeof statsRaw[statsKey] === "object" ? statsRaw[statsKey] : {};
          statsRaw[statsKey] = {
            completed: Number(row.completed) || 0,
            rating_sum: (Number(row.rating_sum) || 0) + selectedRating,
            rating_count: (Number(row.rating_count) || 0) + 1
          };
          localStorage.setItem(statsStore, JSON.stringify(statsRaw));
          ratingSaved = true;
          note.textContent = "Thanks for your rating.";
        } catch {
          note.textContent = "Could not save rating. Try again.";
        }
      });
    }

    function finishTest(message) {
      if (timerHandle) {
        clearInterval(timerHandle);
        timerHandle = null;
      }
      persistCompletion();
      const scoreMsg = `${message} Your score: ${correctCount}/${questions.length}.`;
      showEmpty(scoreMsg);

      const actions = document.createElement("div");
      actions.className = "result-actions";
      actions.innerHTML = `<a class="back" href="test-series.html?exam=${encodeURIComponent(exam)}">Return to Test Series</a>${isCustom ? "" : `<a class="back" href="test-leaderboard.html?exam=${encodeURIComponent(exam)}&test_id=${encodeURIComponent(testId)}&title=${encodeURIComponent(testTitle)}&stats_key=${encodeURIComponent(statsKey)}">View Leaderboard</a>`}`;
      emptyEl.appendChild(actions);

      renderRatingUI();
    }

    function next() {
      if (index >= questions.length - 1) {
        finishTest("Test complete.");
        return;
      }
      index += 1;
      renderQuestion();
    }

    function startTimer() {
      timerLineEl.textContent = `Time left ${formatTime(remainingSeconds)}`;
      timerHandle = setInterval(() => {
        remainingSeconds -= 1;
        timerLineEl.textContent = `Time left ${formatTime(remainingSeconds)}`;
        if (remainingSeconds <= 0) {
          finishTest("Time up. Test submitted automatically.");
        }
      }, 1000);
    }

    actionBtn.addEventListener("click", () => {
      if (!evaluated) evaluate();
      else next();
    });

    backBtn.href = `test-series.html?exam=${encodeURIComponent(exam)}`;
    titleEl.textContent = testTitle;
    metaEl.textContent = `${exam} • ${syllabus} • ${count} Questions • ${minutes} mins`;

    questions = buildQuestions(count);
    if (!questions.length) {
      showEmpty("Could not create questions for this test.");
    } else {
      renderQuestion();
      startTimer();
    }
  </script>
</body>
</html>
