<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teachmint</title>
  <style>
    :root {
      --bg: #07080f;
      --panel: #0f111b;
      --panel-2: #141828;
      --line: #2a2f41;
      --text: #f2f4ff;
      --muted: #99a0bc;
      --brand: #18b5ff;
      --danger: #ff6e9a;
      --ok: #42d492;
      --quick: #cb8526;
      --practice: #4cb32f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% -5%, #203066 0%, transparent 45%),
        linear-gradient(160deg, #07080f 0%, #0a0d1a 60%, #080a13 100%);
      min-height: 100vh;
      padding-bottom: 86px;
    }

    .hidden { display: none !important; }

    .auth-wrap, .app-wrap, .onboarding-wrap {
      width: min(600px, 94vw);
      margin: 1.1rem auto;
    }

    .panel {
      background: linear-gradient(150deg, rgba(22, 24, 38, 0.95), rgba(15, 17, 27, 0.95));
      border: 1px solid #252a3a;
      border-radius: 16px;
      padding: 1rem;
    }

    .brand-row { display: flex; align-items: center; gap: 0.65rem; }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(160deg, #2cc2ff, #0f8dcc);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(24, 181, 255, 0.35);
    }

    .brand-logo svg { width: 25px; height: 25px; }

    h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2rem); }

    .auth-sub { margin: 0.45rem 0 0; color: var(--muted); }

    label { display: block; margin-top: 0.8rem; color: #d6dbef; font-size: 0.95rem; }

    input, button {
      font: inherit;
      color: var(--text);
    }

    .field {
      width: 100%;
      margin-top: 0.35rem;
      border: 1px solid #353b54;
      border-radius: 12px;
      padding: 0.72rem 0.78rem;
      background: #20243a;
      color: var(--text);
    }

    .field:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(24, 181, 255, 0.2);
    }

    .btn {
      margin-top: 0.95rem;
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 0.78rem;
      cursor: pointer;
      font-weight: 600;
      background: linear-gradient(135deg, #18b5ff, #068cd7);
      color: white;
    }

    .status { margin-top: 0.7rem; min-height: 1.1rem; font-size: 0.95rem; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.75rem;
    }

    .welcome { color: var(--muted); font-size: 0.88rem; margin-top: 0.15rem; }

    .logout-btn {
      border: 1px solid #3a405a;
      background: #21263a;
      color: #f2f4ff;
      border-radius: 12px;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid #383d50;
      border-radius: 14px;
      background: #11131d;
      padding: 0.55rem 0.65rem;
    }

    .search-wrap input {
      flex: 1;
      background: transparent;
      border: 0;
      color: #e8ebf9;
      font-size: 1.02rem;
    }

    .search-wrap input:focus { outline: none; }
    .search-wrap input::placeholder { color: #757c99; }

    .search-icon {
      border: 0;
      background: transparent;
      color: #9ea5c5;
      font-size: 1.2rem;
      line-height: 1;
      padding: 0;
    }

    .upload-card {
      margin-top: 0.85rem;
      width: 100%;
      border: 1px solid #31364b;
      border-radius: 14px;
      background: #11141f;
      color: #ecf0ff;
      padding: 1.05rem 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.32rem;
      cursor: pointer;
    }

    .upload-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      border: 1px solid #3a4057;
      background: #1e2438;
      font-size: 1.15rem;
    }

    .upload-text { font-size: 1.22rem; font-weight: 500; }

    .group-date {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #9aa2bf;
      font-weight: 600;
      margin: 1.2rem 0 0.75rem;
      font-size: 1.05rem;
    }

    .group-date::before, .group-date::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2a3042;
    }

    .file-card {
      border-top: 1px solid #23293b;
      padding: 1rem 0 1.1rem;
    }

    .file-name {
      margin: 0;
      font-size: clamp(1.1rem, 4vw, 1.45rem);
      line-height: 1.25;
      word-break: break-word;
    }

    .file-meta {
      margin-top: 0.3rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .file-actions {
      margin-top: 0.92rem;
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
    }

    .action-btn {
      border: 0;
      background: transparent;
      color: #f3f4ff;
      cursor: pointer;
      padding: 0;
      display: grid;
      justify-items: center;
      gap: 0.4rem;
      min-width: 94px;
      align-content: start;
    }

    .action-icon-slot {
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
    }

    .hex {
      width: 70px;
      height: 76px;
      clip-path: polygon(50% 0%, 92% 24%, 92% 76%, 50% 100%, 8% 76%, 8% 24%);
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.45rem;
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .hex.quick { background: linear-gradient(145deg, #d89332, #b9741e); }
    .hex.practice { background: linear-gradient(145deg, #3aa7f2, #1f75bd); }
    .hex.review { background: linear-gradient(145deg, #56c93a, #3b9f24); }
    .hex.analytics { background: linear-gradient(145deg, #7c6cf4, #4e3bc8); }

    .practice-frame {
      --progress: 0;
      position: relative;
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
    }

    .progress-ring {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: conic-gradient(#4cd964 calc(var(--progress) * 1%), #29a8ff 0);
      box-shadow: 0 0 0 2px rgba(41, 168, 255, 0.35);
    }

    .progress-ring::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 999px;
      background: #0f1524;
    }

    .practice-frame .hex.practice {
      position: relative;
      z-index: 2;
      width: 64px;
      height: 70px;
      font-size: 1.35rem;
    }

    .action-label { font-size: 1.05rem; font-weight: 600; }
    .action-sub { font-size: 0.76rem; color: #a6add2; margin-top: -0.12rem; }

    .empty-text {
      color: var(--muted);
      margin-top: 1rem;
      text-align: center;
    }

    .tab-pane.hidden { display: none !important; }

    .practice-tab-wrap {
      margin-top: 0.35rem;
    }

    .practice-select {
      width: 100%;
      border: 1px solid #3a4260;
      border-radius: 12px;
      background: #1d2438;
      color: #eef3ff;
      padding: 0.68rem 0.72rem;
      font: inherit;
      margin-bottom: 0.9rem;
    }

    .practice-topic-list { margin-top: 0.2rem; }

    .practice-topic-card,
    .chapter-picker {
      border: 1px solid #28314a;
      border-radius: 13px;
      background: linear-gradient(150deg, rgba(26, 31, 48, 0.92), rgba(18, 22, 34, 0.92));
      padding: 0.82rem;
    }

    .practice-topic-title {
      margin: 0;
      font-size: 1.06rem;
      line-height: 1.3;
    }

    .practice-topic-meta {
      margin-top: 0.3rem;
      color: #a6afce;
      font-size: 0.86rem;
    }

    .practice-topic-actions {
      margin-top: 0.7rem;
      display: flex;
      gap: 0.8rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .chapter-selector-btn {
      width: 100%;
      border: 1px solid #3a4465;
      border-radius: 12px;
      background: #1c2540;
      color: #eef3ff;
      text-align: left;
      padding: 0.74rem 0.78rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.8rem;
      font: inherit;
    }

    .chapter-selector-btn:hover {
      border-color: #57b7f5;
    }

    .chapter-selector-title {
      margin: 0;
      font-size: 1.04rem;
    }

    .chapter-selector-meta {
      margin-top: 0.25rem;
      color: #a6afce;
      font-size: 0.86rem;
    }

    .chapter-selector-icon {
      color: #c2d5ff;
      font-size: 1.12rem;
      line-height: 1;
      opacity: 0.92;
    }

    .chapter-picker {
      margin-bottom: 0.8rem;
    }

    .subject-group + .subject-group {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid #2d3653;
    }

    .subject-heading {
      margin: 0 0 0.45rem;
      font-size: 0.96rem;
      color: #d4defe;
      font-weight: 700;
    }

    .chapter-list {
      display: grid;
      gap: 0.45rem;
    }

    .chapter-item {
      width: 100%;
      border: 1px solid #3a4465;
      border-radius: 10px;
      background: #1a2338;
      color: #e8eeff;
      text-align: left;
      padding: 0.56rem 0.65rem;
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
    }

    .chapter-item.active {
      border-color: #2eaef6;
      background: #233c61;
    }

    .journey-wrap {
      border: 1px solid #28314a;
      border-radius: 12px;
      background: rgba(19, 26, 42, 0.65);
      padding: 0.65rem 0.6rem 0.72rem;
    }

    .journey-title {
      margin: 0 0 0.55rem;
      font-size: 0.9rem;
      color: #b8c7eb;
      font-weight: 600;
    }

    .practice-journey {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, minmax(88px, 1fr));
      gap: 0.45rem;
      align-items: start;
    }

    .practice-journey::before {
      content: "";
      position: absolute;
      left: 7%;
      right: 7%;
      top: 38px;
      height: 2px;
      background: linear-gradient(90deg, rgba(92, 173, 255, 0.45), rgba(95, 112, 164, 0.45));
      z-index: 0;
    }

    .track-btn {
      min-width: 0;
      width: 100%;
      position: relative;
      z-index: 1;
      gap: 0.28rem;
    }

    .track-btn .action-icon-slot {
      width: 82px;
      height: 78px;
    }

    .track-btn .hex.practice {
      width: 60px;
      height: 66px;
      font-size: 1.22rem;
    }

    .track-btn .action-label {
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.1;
    }

    .track-easy .hex.practice { background: linear-gradient(145deg, #56c93a, #3b9f24); }
    .track-medium .hex.practice { background: linear-gradient(145deg, #3aa7f2, #1f75bd); }
    .track-hard .hex.practice { background: linear-gradient(145deg, #9656f2, #6730b9); }
    .track-pyqs .hex.practice { background: linear-gradient(145deg, #cf8b2d, #9b651f); }
    .track-test .hex.practice { background: linear-gradient(145deg, #e4546d, #b92f50); }

    .practice-empty {
      color: #aab4d4;
      font-size: 0.92rem;
      padding: 0.65rem 0.1rem;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      border-top: 1px solid #2d3551;
      background: rgba(10, 14, 24, 0.97);
      backdrop-filter: blur(6px);
      padding: 0.55rem 0.8rem calc(0.55rem + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .bottom-btn {
      border: 1px solid #3a4260;
      border-radius: 12px;
      background: #1a2237;
      color: #dbe4ff;
      padding: 0.62rem 0.5rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .bottom-btn.active {
      border-color: #2aa8f4;
      background: #223d63;
      color: #eff6ff;
      box-shadow: inset 0 0 0 1px rgba(47, 155, 240, 0.35);
    }

    .onboard-title {
      margin: 0;
      font-size: clamp(1.25rem, 4.8vw, 1.95rem);
      line-height: 1.25;
    }

    .onboard-meta {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .onboard-options {
      margin-top: 0.95rem;
      display: grid;
      gap: 0.65rem;
    }

    .onboard-option {
      width: 100%;
      border: 1px solid #394161;
      border-radius: 12px;
      background: #1c2339;
      color: #ecf1ff;
      text-align: left;
      padding: 0.72rem 0.76rem;
      cursor: pointer;
      font: inherit;
      transition: border-color 0.12s ease, background-color 0.12s ease;
    }

    .onboard-option:hover {
      border-color: #6ea9eb;
    }

    .onboard-option.selected {
      border-color: #43b4ff;
      background: #21395e;
      box-shadow: inset 0 0 0 1px rgba(67, 180, 255, 0.3);
    }

    .onboard-footer {
      margin-top: 1rem;
      display: flex;
      justify-content: flex-end;
    }

    .onboard-next {
      border: 0;
      border-radius: 11px;
      padding: 0.62rem 0.95rem;
      background: linear-gradient(135deg, #18b5ff, #068cd7);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .onboard-next:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 520px) {
      .app-wrap, .auth-wrap, .onboarding-wrap { width: 95vw; }
      .upload-text { font-size: 1.12rem; }
      .practice-journey {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .practice-journey::before { display: none; }
    }
  </style>
</head>
<body>
  <main class="auth-wrap" id="authRoot">
    <section class="panel">
      <div class="brand-row">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 7.5L12 3l9 4.5-9 4.5L3 7.5Z" fill="#E7F8FF" opacity=".95"/>
            <path d="M3 11.6 12 16l9-4.4" stroke="#D6F2FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 7.2v11.2" stroke="#0C5E8D" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>Teachmint</h1>
      </div>

      <p class="auth-sub">Login or create account with email and password</p>

      <form id="authForm">
        <label for="authEmail">Email ID</label>
        <input id="authEmail" class="field" type="email" autocomplete="email" placeholder="you@example.com" required />

        <label for="authPassword">Password</label>
        <input id="authPassword" class="field" type="password" autocomplete="current-password" minlength="8" placeholder="Minimum 8 characters" required />

        <button class="btn" type="submit">Continue</button>
      </form>

      <div id="authStatus" class="status"></div>
    </section>
  </main>

  <main class="onboarding-wrap hidden" id="onboardingRoot">
    <section class="panel">
      <h2 id="onboardingTitle" class="onboard-title">Let's personalize your journey</h2>
      <div id="onboardingMeta" class="onboard-meta">Step 1 of 2</div>
      <div id="onboardingOptions" class="onboard-options"></div>
      <div class="onboard-footer">
        <button id="onboardingNext" class="onboard-next" type="button" disabled>Continue</button>
      </div>
      <div id="onboardingStatus" class="status"></div>
    </section>
  </main>

  <main class="app-wrap hidden" id="appRoot">
    <section class="panel">
      <div class="topbar">
        <div>
          <div class="brand-row">
            <div class="brand-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 7.5L12 3l9 4.5-9 4.5L3 7.5Z" fill="#E7F8FF" opacity=".95"/>
                <path d="M3 11.6 12 16l9-4.4" stroke="#D6F2FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 7.2v11.2" stroke="#0C5E8D" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </div>
            <h1>Teachmint</h1>
          </div>
          <div class="welcome" id="welcomeText">Signed in</div>
        </div>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </div>

      <div id="studyTab" class="tab-pane">
        <div class="search-wrap">
          <input id="fileSearch" type="text" placeholder="Search by topic name" />
          <button class="search-icon" type="button" aria-label="Search">&#128269;</button>
        </div>

        <button id="uploadBtn" class="upload-card" type="button" aria-label="Upload Notes">
          <span class="upload-icon">&#8682;</span>
          <span class="upload-text">Upload Notes</span>
        </button>
        <input id="fileInput" class="hidden" type="file" accept=".txt,.md,.csv,.json,.pdf,text/plain,text/csv,application/json,application/pdf" />

        <div id="status" class="status"></div>

        <div id="fileGroups"></div>
        <div id="emptyState" class="empty-text hidden">No uploaded files yet.</div>
      </div>

      <div id="practiceTab" class="tab-pane hidden practice-tab-wrap">
        <select id="practiceExamSelect" class="practice-select" aria-label="Select exam">
          <option value="JEE">JEE</option>
          <option value="NEET">NEET</option>
          <option value="UPSC">UPSC</option>
        </select>
        <div class="practice-topic-card">
          <button id="chapterSelectorBtn" class="chapter-selector-btn" type="button">
            <div>
              <h3 class="chapter-selector-title" id="selectedChapterTitle">Select a chapter</h3>
              <div class="chapter-selector-meta" id="selectedChapterMeta">Choose subject and chapter</div>
            </div>
            <span id="chapterSelectorIcon" class="chapter-selector-icon">&#9662;</span>
          </button>
          <div id="chapterPicker" class="chapter-picker hidden"></div>
          <div id="practiceTrackList" class="practice-topic-list"></div>
        </div>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Bottom navigation">
      <button id="tabStudyBtn" class="bottom-btn active" type="button">Study Materials</button>
      <button id="tabPracticeBtn" class="bottom-btn" type="button">Practice</button>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="curriculum-data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const api = window.teachmintApi;

    const authRoot = document.getElementById("authRoot");
    const onboardingRoot = document.getElementById("onboardingRoot");
    const appRoot = document.getElementById("appRoot");
    const authForm = document.getElementById("authForm");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const authStatusEl = document.getElementById("authStatus");

    const welcomeText = document.getElementById("welcomeText");
    const logoutBtn = document.getElementById("logoutBtn");
    const fileSearch = document.getElementById("fileSearch");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const fileGroupsEl = document.getElementById("fileGroups");
    const emptyState = document.getElementById("emptyState");
    const studyTab = document.getElementById("studyTab");
    const practiceTab = document.getElementById("practiceTab");
    const tabStudyBtn = document.getElementById("tabStudyBtn");
    const tabPracticeBtn = document.getElementById("tabPracticeBtn");
    const practiceExamSelect = document.getElementById("practiceExamSelect");
    const selectedChapterTitle = document.getElementById("selectedChapterTitle");
    const selectedChapterMeta = document.getElementById("selectedChapterMeta");
    const chapterSelectorBtn = document.getElementById("chapterSelectorBtn");
    const chapterSelectorIcon = document.getElementById("chapterSelectorIcon");
    const chapterPicker = document.getElementById("chapterPicker");
    const practiceTrackList = document.getElementById("practiceTrackList");
    const onboardingTitle = document.getElementById("onboardingTitle");
    const onboardingMeta = document.getElementById("onboardingMeta");
    const onboardingOptions = document.getElementById("onboardingOptions");
    const onboardingNext = document.getElementById("onboardingNext");
    const onboardingStatus = document.getElementById("onboardingStatus");

    let currentUser = null;
    let currentFiles = [];
    let progressByFileId = {};
    let showAnalyticsForUser = true;
    let activeMainTab = "study";
    let selectedPracticeExam = "JEE";
    let selectedPracticeSubject = "";
    let selectedPracticeChapter = "";
    let chapterPickerOpen = false;
    let onboardingUser = null;
    let onboardingStep = 1;
    let onboardingAnswers = {
      exam_target: "",
      daily_practice_time: ""
    };

    const onboardingSteps = [
      {
        key: "exam_target",
        title: "What are you preparing for?",
        options: ["JEE", "NEET", "UPSC"]
      },
      {
        key: "daily_practice_time",
        title: "How much are you willing to spend on practice everyday?",
        options: ["Less than 2 hours", "2 to 6 hours", "More than 6 hours"]
      }
    ];

    const stopWords = new Set([
      "the", "and", "for", "with", "that", "this", "from", "into", "your", "their", "there", "which", "about", "were", "when", "where",
      "have", "has", "had", "been", "being", "also", "than", "then", "because", "while", "after", "before", "over", "under", "between",
      "through", "during", "such", "each", "some", "many", "more", "most", "other", "those", "these", "they", "them", "will", "would",
      "should", "could", "might", "must", "is", "are", "was", "be", "to", "of", "in", "on", "at", "by", "as", "an", "a", "or", "it"
    ]);

    const fmtDate = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    function setAuthStatus(message, type = "") {
      authStatusEl.textContent = message;
      authStatusEl.className = `status ${type}`.trim();
    }

    function setOnboardingStatus(message, type = "") {
      onboardingStatus.textContent = message;
      onboardingStatus.className = `status ${type}`.trim();
    }

    function setActiveTab(tab) {
      activeMainTab = tab === "practice" ? "practice" : "study";
      studyTab.classList.toggle("hidden", activeMainTab !== "study");
      practiceTab.classList.toggle("hidden", activeMainTab !== "practice");
      tabStudyBtn.classList.toggle("active", activeMainTab === "study");
      tabPracticeBtn.classList.toggle("active", activeMainTab === "practice");
    }

    function getCurriculumTopicsForExam(exam) {
      const source = window.curriculumData && window.curriculumData.catalog ? window.curriculumData.catalog : {};
      const map = source && typeof source[exam] === "object" ? source[exam] : {};
      return map && typeof map === "object" ? map : {};
    }

    function ensureValidPracticeSelection() {
      const subjectMap = getCurriculumTopicsForExam(selectedPracticeExam);
      const subjects = Object.keys(subjectMap);
      if (!subjects.length) {
        selectedPracticeSubject = "";
        selectedPracticeChapter = "";
        return;
      }
      if (!selectedPracticeSubject || !subjectMap[selectedPracticeSubject]) {
        selectedPracticeSubject = subjects[0];
      }
      const chapters = Array.isArray(subjectMap[selectedPracticeSubject]) ? subjectMap[selectedPracticeSubject] : [];
      if (!chapters.length) {
        selectedPracticeChapter = "";
        return;
      }
      if (!selectedPracticeChapter || !chapters.includes(selectedPracticeChapter)) {
        selectedPracticeChapter = chapters[0];
      }
    }

    function renderChapterPicker() {
      const subjectMap = getCurriculumTopicsForExam(selectedPracticeExam);
      chapterPicker.innerHTML = "";
      const subjects = Object.keys(subjectMap);
      if (!subjects.length) {
        const msg = document.createElement("div");
        msg.className = "practice-empty";
        msg.textContent = "No curriculum available.";
        chapterPicker.appendChild(msg);
        return;
      }

      for (const subject of subjects) {
        const group = document.createElement("section");
        group.className = "subject-group";
        const heading = document.createElement("h4");
        heading.className = "subject-heading";
        heading.textContent = subject;
        const list = document.createElement("div");
        list.className = "chapter-list";
        const chapters = Array.isArray(subjectMap[subject]) ? subjectMap[subject] : [];
        for (const chapter of chapters) {
          const btn = document.createElement("button");
          btn.className = `chapter-item ${(subject === selectedPracticeSubject && chapter === selectedPracticeChapter) ? "active" : ""}`.trim();
          btn.type = "button";
          btn.textContent = chapter;
          btn.addEventListener("click", () => {
            selectedPracticeSubject = subject;
            selectedPracticeChapter = chapter;
            chapterPickerOpen = false;
            renderPracticeTopics();
          });
          list.appendChild(btn);
        }
        group.append(heading, list);
        chapterPicker.appendChild(group);
      }
    }

    function renderPracticeTracks() {
      const tracks = [
        { id: "Easy", label: "Easy", css: "track-easy" },
        { id: "Medium", label: "Medium", css: "track-medium" },
        { id: "Hard", label: "Hard", css: "track-hard" },
        { id: "PYQs", label: "PYQs", css: "track-pyqs" },
        { id: "Test yourself", label: "Test yourself", css: "track-test" }
      ];
      practiceTrackList.innerHTML = '<div class="journey-wrap"><div class="journey-title">Practice Journey</div><div class="practice-journey" id="practiceJourney"></div></div>';
      const journey = document.getElementById("practiceJourney");
      for (const track of tracks) {
        const btn = document.createElement("button");
        btn.className = `action-btn track-btn ${track.css}`.trim();
        btn.type = "button";
        btn.innerHTML = `<span class="action-icon-slot"><span class="hex practice">&#9654;</span></span><span class="action-label">${track.label}</span>`;
        btn.addEventListener("click", () => {
          const url = `topic-practice.html?exam=${encodeURIComponent(selectedPracticeExam)}&subject=${encodeURIComponent(selectedPracticeSubject)}&chapter=${encodeURIComponent(selectedPracticeChapter)}&track=${encodeURIComponent(track.id)}`;
          window.location.href = url;
        });
        journey.appendChild(btn);
      }
    }

    function renderPracticeTopics() {
      ensureValidPracticeSelection();
      const hasSelection = Boolean(selectedPracticeSubject && selectedPracticeChapter);
      selectedChapterTitle.textContent = hasSelection ? selectedPracticeChapter : "Select a chapter";
      selectedChapterMeta.textContent = hasSelection
        ? `${selectedPracticeSubject}`
        : "Choose subject and chapter";

      chapterPicker.classList.toggle("hidden", !chapterPickerOpen);
      chapterSelectorIcon.innerHTML = chapterPickerOpen ? "&#9652;" : "&#9662;";
      renderChapterPicker();

      practiceTrackList.innerHTML = "";
      if (!hasSelection) {
        const msg = document.createElement("div");
        msg.className = "practice-empty";
        msg.textContent = "No chapter available for selected exam.";
        practiceTrackList.appendChild(msg);
        return;
      }
      renderPracticeTracks();
    }

    function displayNameWithoutExtension(fileName) {
      return String(fileName || "").replace(/\.[^./\\]+$/, "");
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function cleanText(raw) {
      return raw.replace(/\r/g, " ").replace(/\s+/g, " ").replace(/[\u0000-\u001F]+/g, " ").trim();
    }

    function splitSentences(text) {
      return text.split(/(?<=[.!?])\s+/).map((s) => s.trim()).filter((s) => s.length > 40 && s.length < 240);
    }

    function pickKeyword(sentence) {
      const words = sentence.toLowerCase().replace(/[^a-z0-9\s-]/g, "").split(/\s+/).filter((w) => w.length > 3 && !stopWords.has(w));
      if (!words.length) return null;
      words.sort((a, b) => b.length - a.length);
      return words[0];
    }

    function unique(array) {
      return [...new Set(array)];
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function toMcqQuestion(sentence, keyword, keywordPool) {
      const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(`\\b${escaped}\\b`, "i");
      if (!regex.test(sentence)) return null;

      const prompt = sentence.replace(regex, "_____");
      const distractors = shuffle(keywordPool.filter((k) => k !== keyword)).slice(0, 3);
      if (distractors.length < 3) return null;

      return {
        prompt,
        answer: keyword,
        choices: shuffle([keyword, ...distractors])
      };
    }

    function generateMcqQuestionsFromText(text, count = 10) {
      const cleaned = cleanText(text);
      const sentences = splitSentences(cleaned);
      if (sentences.length < 3) return { error: "Not enough usable sentence content in the uploaded file." };

      const sentenceKeywords = sentences.map((sentence) => ({ sentence, keyword: pickKeyword(sentence) })).filter((item) => item.keyword);
      if (sentenceKeywords.length < 3) return { error: "Could not extract enough keywords from the uploaded file." };

      const keywordPool = unique(sentenceKeywords.map((item) => item.keyword));
      if (keywordPool.length < 4) return { error: "Need more varied vocabulary to generate MCQ questions." };

      const candidates = shuffle(sentenceKeywords);
      const output = [];
      let safety = 0;

      while (output.length < count && safety < count * 12) {
        const candidate = candidates[safety % candidates.length];
        const question = toMcqQuestion(candidate.sentence, candidate.keyword, keywordPool);
        if (question) output.push(question);
        safety += 1;
      }

      if (!output.length) return { error: "No MCQ questions could be generated from this file." };

      if (output.length < count) {
        const seed = [...output];
        let i = 0;
        while (output.length < count) {
          const base = seed[i % seed.length];
          output.push({ prompt: base.prompt, answer: base.answer, choices: shuffle([...base.choices]) });
          i += 1;
        }
      }

      return { questions: output.slice(0, count) };
    }

    async function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Failed to read file."));
        reader.readAsText(file);
      });
    }

    async function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Failed to read PDF file."));
        reader.readAsArrayBuffer(file);
      });
    }

    async function extractTextFromPdf(file) {
      if (typeof pdfjsLib === "undefined") {
        throw new Error("PDF engine failed to load. Use a local server and try again.");
      }

      const pdfData = await readFileAsArrayBuffer(file);
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const loadingTask = pdfjsLib.getDocument({ data: pdfData });
      const pdf = await loadingTask.promise;
      const pages = [];

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
        const page = await pdf.getPage(pageNumber);
        const content = await page.getTextContent();
        const pageText = content.items.map((item) => item.str).join(" ").trim();
        if (pageText) pages.push(pageText);
      }

      return pages.join(" ");
    }

    function showAuth() {
      onboardingRoot.classList.add("hidden");
      appRoot.classList.add("hidden");
      authRoot.classList.remove("hidden");
      authForm.reset();
      setStatus("");
      setAuthStatus("");
      currentUser = null;
      currentFiles = [];
      progressByFileId = {};
      showAnalyticsForUser = true;
      selectedPracticeExam = "JEE";
      selectedPracticeSubject = "";
      selectedPracticeChapter = "";
      chapterPickerOpen = false;
      setActiveTab("study");
      onboardingUser = null;
      onboardingStep = 1;
      onboardingAnswers = { exam_target: "", daily_practice_time: "" };
    }

    function renderOnboardingStep() {
      const step = onboardingSteps[onboardingStep - 1];
      if (!step) return;
      onboardingTitle.textContent = step.title;
      onboardingMeta.textContent = `Step ${onboardingStep} of ${onboardingSteps.length}`;
      onboardingNext.textContent = onboardingStep === onboardingSteps.length ? "Finish" : "Continue";
      onboardingNext.disabled = !onboardingAnswers[step.key];
      onboardingOptions.innerHTML = "";
      for (const option of step.options) {
        const btn = document.createElement("button");
        btn.type = "button";
        const selected = onboardingAnswers[step.key] === option;
        btn.className = `onboard-option ${selected ? "selected" : ""}`.trim();
        btn.textContent = option;
        btn.addEventListener("click", () => {
          onboardingAnswers[step.key] = option;
          renderOnboardingStep();
        });
        onboardingOptions.appendChild(btn);
      }
    }

    function showOnboarding(user, existingOnboarding) {
      currentUser = user;
      onboardingUser = user;
      authRoot.classList.add("hidden");
      appRoot.classList.add("hidden");
      onboardingRoot.classList.remove("hidden");
      onboardingAnswers = {
        exam_target: existingOnboarding && existingOnboarding.exam_target ? existingOnboarding.exam_target : "",
        daily_practice_time: existingOnboarding && existingOnboarding.daily_practice_time ? existingOnboarding.daily_practice_time : ""
      };
      onboardingStep = onboardingAnswers.exam_target ? 2 : 1;
      setOnboardingStatus("");
      renderOnboardingStep();
    }

    async function loadLibraryData() {
      if (!currentUser) return;
      const dbFiles = await api.listFiles(currentUser.id);
      currentFiles = dbFiles.map((row) => ({
        id: row.id,
        name: row.name,
        uploadedAt: row.uploaded_at,
        text: row.text_content,
        questions: Array.isArray(row.questions) ? row.questions : []
      }));
      const progressRows = await api.listProgressForFiles(currentUser.id, currentFiles.map((f) => f.id));
      progressByFileId = {};
      for (const row of progressRows) {
        progressByFileId[row.file_id] = row;
      }
    }

    async function showApp(user, onboardingData = null) {
      currentUser = user;
      authRoot.classList.add("hidden");
      onboardingRoot.classList.add("hidden");
      appRoot.classList.remove("hidden");
      welcomeText.textContent = `Signed in as ${user.email || "user"}`;
      try {
        showAnalyticsForUser = await api.isFeatureEnabledForUser("analytics_library", user.id, 100);
      } catch {
        showAnalyticsForUser = true;
      }
      const preferredExam = onboardingData && typeof onboardingData.exam_target === "string"
        ? onboardingData.exam_target.trim().toUpperCase()
        : "";
      selectedPracticeExam = ["JEE", "NEET", "UPSC"].includes(preferredExam) ? preferredExam : "JEE";
      practiceExamSelect.value = selectedPracticeExam;
      selectedPracticeSubject = "";
      selectedPracticeChapter = "";
      chapterPickerOpen = false;
      renderPracticeTopics();
      const tabParam = new URLSearchParams(window.location.search).get("tab");
      setActiveTab(tabParam === "practice" ? "practice" : "study");
      fileSearch.value = "";
      await loadLibraryData();
      renderFiles();
      setStatus("");
    }

    async function routeAfterLogin(user, isNewSignup = false) {
      let onboarding = null;
      try {
        onboarding = await api.getUserOnboarding(user.id);
      } catch {}
      const needsOnboarding = (isNewSignup && (!onboarding || !onboarding.completed_at))
        || Boolean(onboarding && !onboarding.completed_at);
      if (needsOnboarding) {
        showOnboarding(user, onboarding);
        return;
      }
      await showApp(user, onboarding);
    }

    function getAttemptedCount(fileId) {
      const row = progressByFileId[fileId];
      return new Set(row && Array.isArray(row.practice_attempted) ? row.practice_attempted : []).size;
    }

    function getCorrectCount(fileId) {
      const row = progressByFileId[fileId];
      return new Set(row && Array.isArray(row.practice_correct) ? row.practice_correct : []).size;
    }

    function renderFiles() {
      const query = fileSearch.value.trim().toLowerCase();
      const files = [...currentFiles]
        .filter((file) => file.name.toLowerCase().includes(query))
        .sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));

      fileGroupsEl.innerHTML = "";
      emptyState.classList.toggle("hidden", files.length > 0);
      if (!files.length) return;

      const groups = new Map();
      for (const file of files) {
        const key = new Date(file.uploadedAt).toISOString().slice(0, 10);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(file);
      }

      for (const [key, groupFiles] of groups.entries()) {
        const heading = document.createElement("div");
        heading.className = "group-date";
        heading.textContent = fmtDate.format(new Date(key));
        fileGroupsEl.appendChild(heading);

        for (const file of groupFiles) {
          const card = document.createElement("article");
          card.className = "file-card";

          const name = document.createElement("h3");
          name.className = "file-name";
          name.textContent = displayNameWithoutExtension(file.name);

          const actions = document.createElement("div");
          actions.className = "file-actions";

          const quickBtn = document.createElement("button");
          quickBtn.className = "action-btn";
          quickBtn.type = "button";
          quickBtn.innerHTML = '<span class="action-icon-slot"><span class="hex quick">&#128214;</span></span><span class="action-label">Quick Review</span>';
          quickBtn.addEventListener("click", () => {
            window.location.href = `review.html?id=${encodeURIComponent(file.id)}`;
          });

          const attemptedCount = getAttemptedCount(file.id);
          const correctCount = getCorrectCount(file.id);
          const progressPercent = Math.round((attemptedCount / 10) * 100);
          const isMastered = correctCount >= 10;

          const practiceBtn = document.createElement("button");
          practiceBtn.className = "action-btn";
          practiceBtn.type = "button";
          if (isMastered) {
            practiceBtn.innerHTML = '<span class="action-icon-slot"><span class="hex review">&#11088;</span></span><span class="action-label">Review</span>';
            practiceBtn.addEventListener("click", () => {
              window.location.href = `practice.html?id=${encodeURIComponent(file.id)}&mode=review`;
            });
          } else {
            practiceBtn.innerHTML = `<span class="action-icon-slot"><span class="practice-frame" style="--progress:${progressPercent};"><span class="progress-ring" aria-hidden="true"></span><span class="hex practice">&#9654;</span></span></span><span class="action-label">Practice</span>`;
            practiceBtn.addEventListener("click", () => {
              window.location.href = `practice.html?id=${encodeURIComponent(file.id)}&mode=practice`;
            });
          }

          actions.append(quickBtn, practiceBtn);
          if (showAnalyticsForUser) {
            const analyticsBtn = document.createElement("button");
            analyticsBtn.className = "action-btn";
            analyticsBtn.type = "button";
            analyticsBtn.innerHTML = '<span class="action-icon-slot"><span class="hex analytics">&#128202;</span></span><span class="action-label">Analytics</span>';
            analyticsBtn.addEventListener("click", () => {
              window.location.href = `analytics.html?id=${encodeURIComponent(file.id)}`;
            });
            actions.appendChild(analyticsBtn);
          }
          card.append(name, actions);
          fileGroupsEl.appendChild(card);
        }
      }
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!api || !api.isConfigured()) {
        setAuthStatus("Supabase is not configured. Set values in supabase-config.js", "error");
        return;
      }

      const email = authEmail.value.trim().toLowerCase();
      const password = authPassword.value;

      if (!isValidEmail(email) || !password) {
        setAuthStatus("Enter both email and password.", "error");
        return;
      }

      if (password.length < 8) {
        setAuthStatus("Password must be at least 8 characters.", "error");
        return;
      }

      try {
        const result = await api.signInOrCreate(email, password);
        if (!result.ok) {
          if (result.reason === "wrong_password") {
            setAuthStatus("Wrong password.", "error");
            return;
          }
          if (result.reason === "email_confirmation_required") {
            setAuthStatus("Enable auto-confirm in Supabase Auth or confirm this email first.", "error");
            return;
          }
          setAuthStatus(result.error?.message || "Login failed.", "error");
          return;
        }
        authForm.reset();
        setAuthStatus(result.created ? "Account created and signed in." : "", result.created ? "ok" : "");
        await routeAfterLogin(result.user, result.created);
      } catch (err) {
        setAuthStatus(err.message || "Login failed.", "error");
      }
    });

    onboardingNext.addEventListener("click", async () => {
      if (!api || !api.isConfigured() || !onboardingUser) return;
      const step = onboardingSteps[onboardingStep - 1];
      if (!step || !onboardingAnswers[step.key]) return;

      onboardingNext.disabled = true;
      setOnboardingStatus("");
      try {
        if (onboardingStep === 1) {
          await api.upsertUserOnboarding(onboardingUser.id, {
            exam_target: onboardingAnswers.exam_target,
            daily_practice_time: onboardingAnswers.daily_practice_time || null,
            completed_at: null
          });
          onboardingStep = 2;
          renderOnboardingStep();
          return;
        }

        await api.upsertUserOnboarding(onboardingUser.id, {
          exam_target: onboardingAnswers.exam_target,
          daily_practice_time: onboardingAnswers.daily_practice_time,
          completed_at: new Date().toISOString()
        });
        await showApp(onboardingUser, onboardingAnswers);
      } catch (err) {
        setOnboardingStatus(err.message || "Could not save onboarding. Try again.", "error");
      } finally {
        if (onboardingRoot.classList.contains("hidden")) {
          onboardingNext.disabled = false;
        } else {
          const currentStep = onboardingSteps[onboardingStep - 1];
          onboardingNext.disabled = !currentStep || !onboardingAnswers[currentStep.key];
        }
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        if (api && api.isConfigured()) {
          await api.signOut();
        }
      } catch {}
      showAuth();
    });

    tabStudyBtn.addEventListener("click", () => setActiveTab("study"));
    tabPracticeBtn.addEventListener("click", () => setActiveTab("practice"));
    practiceExamSelect.addEventListener("change", () => {
      selectedPracticeExam = practiceExamSelect.value;
      selectedPracticeSubject = "";
      selectedPracticeChapter = "";
      chapterPickerOpen = false;
      renderPracticeTopics();
    });
    chapterSelectorBtn.addEventListener("click", () => {
      chapterPickerOpen = !chapterPickerOpen;
      renderPracticeTopics();
    });

    fileSearch.addEventListener("input", renderFiles);

    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      fileInput.value = "";
      if (!file || !currentUser) return;
      if (!api || !api.isConfigured()) {
        setStatus("Supabase is not configured. Set values in supabase-config.js", "error");
        return;
      }

      setStatus("Uploading and generating 10 MCQ questions...");
      uploadBtn.disabled = true;

      try {
        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        const extractedText = isPdf ? await extractTextFromPdf(file) : await readFileAsText(file);

        if (!extractedText.trim()) {
          setStatus("This file has no readable text content.", "error");
          return;
        }

        const generated = generateMcqQuestionsFromText(extractedText, 10);
        if (generated.error) {
          setStatus(generated.error, "error");
          return;
        }

        await api.createFile(currentUser.id, {
          id: (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function")
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2, 10)}`,
          name: file.name,
          uploaded_at: new Date().toISOString(),
          text_content: extractedText,
          questions: generated.questions
        });

        await loadLibraryData();
        renderFiles();
        setStatus(`Uploaded ${file.name}. Generated 10 MCQ questions.`, "ok");
      } catch (err) {
        setStatus(err.message || "Failed to process uploaded file.", "error");
      } finally {
        uploadBtn.disabled = false;
      }
    });

    async function init() {
      showAuth();
      if (!api || !api.isConfigured()) {
        setAuthStatus("Configure Supabase URL and key in supabase-config.js", "error");
        return;
      }
      try {
        const user = await api.getCurrentUser();
        if (user) {
          await routeAfterLogin(user, false);
        } else {
          showAuth();
        }
      } catch (err) {
        setAuthStatus(err.message || "Failed to initialize session.", "error");
      }
    }

    init();
  </script>
