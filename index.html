<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teachmint</title>
  <style>
    :root {
      --bg: #07080f;
      --panel: #0f111b;
      --panel-2: #141828;
      --line: #2a2f41;
      --text: #f2f4ff;
      --muted: #99a0bc;
      --brand: #18b5ff;
      --danger: #ff6e9a;
      --ok: #42d492;
      --quick: #cb8526;
      --practice: #4cb32f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% -5%, #203066 0%, transparent 45%),
        linear-gradient(160deg, #07080f 0%, #0a0d1a 60%, #080a13 100%);
      min-height: 100vh;
    }

    .hidden { display: none !important; }

    .auth-wrap, .app-wrap {
      width: min(600px, 94vw);
      margin: 1.1rem auto;
    }

    .panel {
      background: linear-gradient(150deg, rgba(22, 24, 38, 0.95), rgba(15, 17, 27, 0.95));
      border: 1px solid #252a3a;
      border-radius: 16px;
      padding: 1rem;
    }

    .brand-row { display: flex; align-items: center; gap: 0.65rem; }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(160deg, #2cc2ff, #0f8dcc);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(24, 181, 255, 0.35);
    }

    .brand-logo svg { width: 25px; height: 25px; }

    h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2rem); }

    .auth-sub { margin: 0.45rem 0 0; color: var(--muted); }

    label { display: block; margin-top: 0.8rem; color: #d6dbef; font-size: 0.95rem; }

    input, button {
      font: inherit;
      color: var(--text);
    }

    .field {
      width: 100%;
      margin-top: 0.35rem;
      border: 1px solid #353b54;
      border-radius: 12px;
      padding: 0.72rem 0.78rem;
      background: #20243a;
      color: var(--text);
    }

    .field:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(24, 181, 255, 0.2);
    }

    .btn {
      margin-top: 0.95rem;
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 0.78rem;
      cursor: pointer;
      font-weight: 600;
      background: linear-gradient(135deg, #18b5ff, #068cd7);
      color: white;
    }

    .status { margin-top: 0.7rem; min-height: 1.1rem; font-size: 0.95rem; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.75rem;
    }

    .welcome { color: var(--muted); font-size: 0.88rem; margin-top: 0.15rem; }

    .logout-btn {
      border: 1px solid #3a405a;
      background: #21263a;
      color: #f2f4ff;
      border-radius: 12px;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid #383d50;
      border-radius: 14px;
      background: #11131d;
      padding: 0.55rem 0.65rem;
    }

    .search-wrap input {
      flex: 1;
      background: transparent;
      border: 0;
      color: #e8ebf9;
      font-size: 1.02rem;
    }

    .search-wrap input:focus { outline: none; }
    .search-wrap input::placeholder { color: #757c99; }

    .search-icon {
      border: 0;
      background: transparent;
      color: #9ea5c5;
      font-size: 1.2rem;
      line-height: 1;
      padding: 0;
    }

    .upload-card {
      margin-top: 0.85rem;
      width: 100%;
      border: 1px solid #31364b;
      border-radius: 14px;
      background: #11141f;
      color: #ecf0ff;
      padding: 1.05rem 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.32rem;
      cursor: pointer;
    }

    .upload-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      border: 1px solid #3a4057;
      background: #1e2438;
      font-size: 1.15rem;
    }

    .upload-text { font-size: 1.22rem; font-weight: 500; }

    .group-date {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #9aa2bf;
      font-weight: 600;
      margin: 1.2rem 0 0.75rem;
      font-size: 1.05rem;
    }

    .group-date::before, .group-date::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2a3042;
    }

    .file-card {
      border-top: 1px solid #23293b;
      padding: 1rem 0 1.1rem;
    }

    .file-name {
      margin: 0;
      font-size: clamp(1.1rem, 4vw, 1.45rem);
      line-height: 1.25;
      word-break: break-word;
    }

    .file-meta {
      margin-top: 0.3rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .file-actions {
      margin-top: 0.92rem;
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
    }

    .action-btn {
      border: 0;
      background: transparent;
      color: #f3f4ff;
      cursor: pointer;
      padding: 0;
      display: grid;
      justify-items: center;
      gap: 0.4rem;
      min-width: 94px;
      align-content: start;
    }

    .action-icon-slot {
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
    }

    .hex {
      width: 70px;
      height: 76px;
      clip-path: polygon(50% 0%, 92% 24%, 92% 76%, 50% 100%, 8% 76%, 8% 24%);
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.45rem;
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .hex.quick { background: linear-gradient(145deg, #d89332, #b9741e); }
    .hex.practice { background: linear-gradient(145deg, #3aa7f2, #1f75bd); }
    .hex.review { background: linear-gradient(145deg, #56c93a, #3b9f24); }
    .hex.analytics { background: linear-gradient(145deg, #7c6cf4, #4e3bc8); }

    .practice-frame {
      --progress: 0;
      position: relative;
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
    }

    .progress-ring {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: conic-gradient(#4cd964 calc(var(--progress) * 1%), #29a8ff 0);
      box-shadow: 0 0 0 2px rgba(41, 168, 255, 0.35);
    }

    .progress-ring::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 999px;
      background: #0f1524;
    }

    .practice-frame .hex.practice {
      position: relative;
      z-index: 2;
      width: 64px;
      height: 70px;
      font-size: 1.35rem;
    }

    .action-label { font-size: 1.05rem; font-weight: 600; }
    .action-sub { font-size: 0.76rem; color: #a6add2; margin-top: -0.12rem; }

    .empty-text {
      color: var(--muted);
      margin-top: 1rem;
      text-align: center;
    }

    @media (max-width: 520px) {
      .app-wrap, .auth-wrap { width: 95vw; }
      .upload-text { font-size: 1.12rem; }
    }
  </style>
</head>
<body>
  <main class="auth-wrap" id="authRoot">
    <section class="panel">
      <div class="brand-row">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 7.5L12 3l9 4.5-9 4.5L3 7.5Z" fill="#E7F8FF" opacity=".95"/>
            <path d="M3 11.6 12 16l9-4.4" stroke="#D6F2FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 7.2v11.2" stroke="#0C5E8D" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>Teachmint</h1>
      </div>

      <p class="auth-sub">Login or create account with email and password</p>

      <form id="authForm">
        <label for="authEmail">Email ID</label>
        <input id="authEmail" class="field" type="email" autocomplete="email" placeholder="you@example.com" required />

        <label for="authPassword">Password</label>
        <input id="authPassword" class="field" type="password" autocomplete="current-password" minlength="8" placeholder="Minimum 8 characters" required />

        <button class="btn" type="submit">Continue</button>
      </form>

      <div id="authStatus" class="status"></div>
    </section>
  </main>

  <main class="app-wrap hidden" id="appRoot">
    <section class="panel">
      <div class="topbar">
        <div>
          <div class="brand-row">
            <div class="brand-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 7.5L12 3l9 4.5-9 4.5L3 7.5Z" fill="#E7F8FF" opacity=".95"/>
                <path d="M3 11.6 12 16l9-4.4" stroke="#D6F2FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 7.2v11.2" stroke="#0C5E8D" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </div>
            <h1>Teachmint</h1>
          </div>
          <div class="welcome" id="welcomeText">Signed in</div>
        </div>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </div>

      <div class="search-wrap">
        <input id="fileSearch" type="text" placeholder="Search by topic name" />
        <button class="search-icon" type="button" aria-label="Search">&#128269;</button>
      </div>

      <button id="uploadBtn" class="upload-card" type="button" aria-label="Upload Notes">
        <span class="upload-icon">&#8682;</span>
        <span class="upload-text">Upload Notes</span>
      </button>
      <input id="fileInput" class="hidden" type="file" accept=".txt,.md,.csv,.json,.pdf,text/plain,text/csv,application/json,application/pdf" />

      <div id="status" class="status"></div>

      <div id="fileGroups"></div>
      <div id="emptyState" class="empty-text hidden">No uploaded files yet.</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const api = window.teachmintApi;

    const authRoot = document.getElementById("authRoot");
    const appRoot = document.getElementById("appRoot");
    const authForm = document.getElementById("authForm");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const authStatusEl = document.getElementById("authStatus");

    const welcomeText = document.getElementById("welcomeText");
    const logoutBtn = document.getElementById("logoutBtn");
    const fileSearch = document.getElementById("fileSearch");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const fileGroupsEl = document.getElementById("fileGroups");
    const emptyState = document.getElementById("emptyState");

    let currentUser = null;
    let currentFiles = [];
    let progressByFileId = {};
    let showAnalyticsForUser = true;

    const stopWords = new Set([
      "the", "and", "for", "with", "that", "this", "from", "into", "your", "their", "there", "which", "about", "were", "when", "where",
      "have", "has", "had", "been", "being", "also", "than", "then", "because", "while", "after", "before", "over", "under", "between",
      "through", "during", "such", "each", "some", "many", "more", "most", "other", "those", "these", "they", "them", "will", "would",
      "should", "could", "might", "must", "is", "are", "was", "be", "to", "of", "in", "on", "at", "by", "as", "an", "a", "or", "it"
    ]);

    const fmtDate = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    function setAuthStatus(message, type = "") {
      authStatusEl.textContent = message;
      authStatusEl.className = `status ${type}`.trim();
    }

    function displayNameWithoutExtension(fileName) {
      return String(fileName || "").replace(/\.[^./\\]+$/, "");
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function cleanText(raw) {
      return raw.replace(/\r/g, " ").replace(/\s+/g, " ").replace(/[\u0000-\u001F]+/g, " ").trim();
    }

    function splitSentences(text) {
      return text.split(/(?<=[.!?])\s+/).map((s) => s.trim()).filter((s) => s.length > 40 && s.length < 240);
    }

    function pickKeyword(sentence) {
      const words = sentence.toLowerCase().replace(/[^a-z0-9\s-]/g, "").split(/\s+/).filter((w) => w.length > 3 && !stopWords.has(w));
      if (!words.length) return null;
      words.sort((a, b) => b.length - a.length);
      return words[0];
    }

    function unique(array) {
      return [...new Set(array)];
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function toMcqQuestion(sentence, keyword, keywordPool) {
      const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(`\\b${escaped}\\b`, "i");
      if (!regex.test(sentence)) return null;

      const prompt = sentence.replace(regex, "_____");
      const distractors = shuffle(keywordPool.filter((k) => k !== keyword)).slice(0, 3);
      if (distractors.length < 3) return null;

      return {
        prompt,
        answer: keyword,
        choices: shuffle([keyword, ...distractors])
      };
    }

    function generateMcqQuestionsFromText(text, count = 10) {
      const cleaned = cleanText(text);
      const sentences = splitSentences(cleaned);
      if (sentences.length < 3) return { error: "Not enough usable sentence content in the uploaded file." };

      const sentenceKeywords = sentences.map((sentence) => ({ sentence, keyword: pickKeyword(sentence) })).filter((item) => item.keyword);
      if (sentenceKeywords.length < 3) return { error: "Could not extract enough keywords from the uploaded file." };

      const keywordPool = unique(sentenceKeywords.map((item) => item.keyword));
      if (keywordPool.length < 4) return { error: "Need more varied vocabulary to generate MCQ questions." };

      const candidates = shuffle(sentenceKeywords);
      const output = [];
      let safety = 0;

      while (output.length < count && safety < count * 12) {
        const candidate = candidates[safety % candidates.length];
        const question = toMcqQuestion(candidate.sentence, candidate.keyword, keywordPool);
        if (question) output.push(question);
        safety += 1;
      }

      if (!output.length) return { error: "No MCQ questions could be generated from this file." };

      if (output.length < count) {
        const seed = [...output];
        let i = 0;
        while (output.length < count) {
          const base = seed[i % seed.length];
          output.push({ prompt: base.prompt, answer: base.answer, choices: shuffle([...base.choices]) });
          i += 1;
        }
      }

      return { questions: output.slice(0, count) };
    }

    async function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Failed to read file."));
        reader.readAsText(file);
      });
    }

    async function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Failed to read PDF file."));
        reader.readAsArrayBuffer(file);
      });
    }

    async function extractTextFromPdf(file) {
      if (typeof pdfjsLib === "undefined") {
        throw new Error("PDF engine failed to load. Use a local server and try again.");
      }

      const pdfData = await readFileAsArrayBuffer(file);
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const loadingTask = pdfjsLib.getDocument({ data: pdfData });
      const pdf = await loadingTask.promise;
      const pages = [];

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
        const page = await pdf.getPage(pageNumber);
        const content = await page.getTextContent();
        const pageText = content.items.map((item) => item.str).join(" ").trim();
        if (pageText) pages.push(pageText);
      }

      return pages.join(" ");
    }

    function showAuth() {
      appRoot.classList.add("hidden");
      authRoot.classList.remove("hidden");
      authForm.reset();
      setStatus("");
      setAuthStatus("");
      currentUser = null;
      currentFiles = [];
      progressByFileId = {};
      showAnalyticsForUser = true;
    }

    async function loadLibraryData() {
      if (!currentUser) return;
      const dbFiles = await api.listFiles(currentUser.id);
      currentFiles = dbFiles.map((row) => ({
        id: row.id,
        name: row.name,
        uploadedAt: row.uploaded_at,
        text: row.text_content,
        questions: Array.isArray(row.questions) ? row.questions : []
      }));
      const progressRows = await api.listProgressForFiles(currentUser.id, currentFiles.map((f) => f.id));
      progressByFileId = {};
      for (const row of progressRows) {
        progressByFileId[row.file_id] = row;
      }
    }

    async function showApp(user) {
      currentUser = user;
      authRoot.classList.add("hidden");
      appRoot.classList.remove("hidden");
      welcomeText.textContent = `Signed in as ${user.email || "user"}`;
      try {
        showAnalyticsForUser = await api.isFeatureEnabledForUser("analytics_library", user.id, 100);
      } catch {
        showAnalyticsForUser = true;
      }
      fileSearch.value = "";
      await loadLibraryData();
      renderFiles();
      setStatus("");
    }

    function getAttemptedCount(fileId) {
      const row = progressByFileId[fileId];
      return new Set(row && Array.isArray(row.practice_attempted) ? row.practice_attempted : []).size;
    }

    function getCorrectCount(fileId) {
      const row = progressByFileId[fileId];
      return new Set(row && Array.isArray(row.practice_correct) ? row.practice_correct : []).size;
    }

    function renderFiles() {
      const query = fileSearch.value.trim().toLowerCase();
      const files = [...currentFiles]
        .filter((file) => file.name.toLowerCase().includes(query))
        .sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));

      fileGroupsEl.innerHTML = "";
      emptyState.classList.toggle("hidden", files.length > 0);
      if (!files.length) return;

      const groups = new Map();
      for (const file of files) {
        const key = new Date(file.uploadedAt).toISOString().slice(0, 10);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(file);
      }

      for (const [key, groupFiles] of groups.entries()) {
        const heading = document.createElement("div");
        heading.className = "group-date";
        heading.textContent = fmtDate.format(new Date(key));
        fileGroupsEl.appendChild(heading);

        for (const file of groupFiles) {
          const card = document.createElement("article");
          card.className = "file-card";

          const name = document.createElement("h3");
          name.className = "file-name";
          name.textContent = displayNameWithoutExtension(file.name);

          const actions = document.createElement("div");
          actions.className = "file-actions";

          const quickBtn = document.createElement("button");
          quickBtn.className = "action-btn";
          quickBtn.type = "button";
          quickBtn.innerHTML = '<span class="action-icon-slot"><span class="hex quick">&#128214;</span></span><span class="action-label">Quick Review</span>';
          quickBtn.addEventListener("click", () => {
            window.location.href = `review.html?id=${encodeURIComponent(file.id)}`;
          });

          const attemptedCount = getAttemptedCount(file.id);
          const correctCount = getCorrectCount(file.id);
          const progressPercent = Math.round((attemptedCount / 10) * 100);
          const isMastered = correctCount >= 10;

          const practiceBtn = document.createElement("button");
          practiceBtn.className = "action-btn";
          practiceBtn.type = "button";
          if (isMastered) {
            practiceBtn.innerHTML = '<span class="action-icon-slot"><span class="hex review">&#11088;</span></span><span class="action-label">Review</span>';
            practiceBtn.addEventListener("click", () => {
              window.location.href = `practice.html?id=${encodeURIComponent(file.id)}&mode=review`;
            });
          } else {
            practiceBtn.innerHTML = `<span class="action-icon-slot"><span class="practice-frame" style="--progress:${progressPercent};"><span class="progress-ring" aria-hidden="true"></span><span class="hex practice">&#9654;</span></span></span><span class="action-label">Practice</span>`;
            practiceBtn.addEventListener("click", () => {
              window.location.href = `practice.html?id=${encodeURIComponent(file.id)}&mode=practice`;
            });
          }

          actions.append(quickBtn, practiceBtn);
          if (showAnalyticsForUser) {
            const analyticsBtn = document.createElement("button");
            analyticsBtn.className = "action-btn";
            analyticsBtn.type = "button";
            analyticsBtn.innerHTML = '<span class="action-icon-slot"><span class="hex analytics">&#128202;</span></span><span class="action-label">Analytics</span>';
            analyticsBtn.addEventListener("click", () => {
              window.location.href = `analytics.html?id=${encodeURIComponent(file.id)}`;
            });
            actions.appendChild(analyticsBtn);
          }
          card.append(name, actions);
          fileGroupsEl.appendChild(card);
        }
      }
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!api || !api.isConfigured()) {
        setAuthStatus("Supabase is not configured. Set values in supabase-config.js", "error");
        return;
      }

      const email = authEmail.value.trim().toLowerCase();
      const password = authPassword.value;

      if (!isValidEmail(email) || !password) {
        setAuthStatus("Enter both email and password.", "error");
        return;
      }

      if (password.length < 8) {
        setAuthStatus("Password must be at least 8 characters.", "error");
        return;
      }

      try {
        const result = await api.signInOrCreate(email, password);
        if (!result.ok) {
          if (result.reason === "wrong_password") {
            setAuthStatus("Wrong password.", "error");
            return;
          }
          if (result.reason === "email_confirmation_required") {
            setAuthStatus("Enable auto-confirm in Supabase Auth or confirm this email first.", "error");
            return;
          }
          setAuthStatus(result.error?.message || "Login failed.", "error");
          return;
        }
        authForm.reset();
        setAuthStatus(result.created ? "Account created and signed in." : "", result.created ? "ok" : "");
        await showApp(result.user);
      } catch (err) {
        setAuthStatus(err.message || "Login failed.", "error");
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        if (api && api.isConfigured()) {
          await api.signOut();
        }
      } catch {}
      showAuth();
    });

    fileSearch.addEventListener("input", renderFiles);

    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      fileInput.value = "";
      if (!file || !currentUser) return;
      if (!api || !api.isConfigured()) {
        setStatus("Supabase is not configured. Set values in supabase-config.js", "error");
        return;
      }

      setStatus("Uploading and generating 10 MCQ questions...");
      uploadBtn.disabled = true;

      try {
        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        const extractedText = isPdf ? await extractTextFromPdf(file) : await readFileAsText(file);

        if (!extractedText.trim()) {
          setStatus("This file has no readable text content.", "error");
          return;
        }

        const generated = generateMcqQuestionsFromText(extractedText, 10);
        if (generated.error) {
          setStatus(generated.error, "error");
          return;
        }

        await api.createFile(currentUser.id, {
          id: (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function")
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2, 10)}`,
          name: file.name,
          uploaded_at: new Date().toISOString(),
          text_content: extractedText,
          questions: generated.questions
        });

        await loadLibraryData();
        renderFiles();
        setStatus(`Uploaded ${file.name}. Generated 10 MCQ questions.`, "ok");
      } catch (err) {
        setStatus(err.message || "Failed to process uploaded file.", "error");
      } finally {
        uploadBtn.disabled = false;
      }
    });

    async function init() {
      showAuth();
      if (!api || !api.isConfigured()) {
        setAuthStatus("Configure Supabase URL and key in supabase-config.js", "error");
        return;
      }
      try {
        const user = await api.getCurrentUser();
        if (user) {
          await showApp(user);
        } else {
          showAuth();
        }
      } catch (err) {
        setAuthStatus(err.message || "Failed to initialize session.", "error");
      }
    }

    init();
  </script>
</body>
</html>
