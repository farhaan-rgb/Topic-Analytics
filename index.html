<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teachmint</title>
  <style>
    :root {
      --bg: #07080f;
      --panel: #0f111b;
      --panel-2: #141828;
      --line: #2a2f41;
      --text: #f2f4ff;
      --muted: #99a0bc;
      --brand: #18b5ff;
      --danger: #ff6e9a;
      --ok: #42d492;
      --quick: #cb8526;
      --practice: #4cb32f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% -5%, #203066 0%, transparent 45%),
        linear-gradient(160deg, #07080f 0%, #0a0d1a 60%, #080a13 100%);
      min-height: 100vh;
      padding-bottom: 86px;
    }

    .hidden { display: none !important; }

    .auth-wrap, .app-wrap, .onboarding-wrap {
      width: min(600px, 94vw);
      margin: 1.1rem auto;
    }

    .auth-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 0.8rem;
    }

    .auth-brand {
      display: grid;
      justify-items: center;
      gap: 0.4rem;
    }

    .auth-brand h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.1rem);
    }

    .auth-carousel {
      border: 1px solid #252a3a;
      border-radius: 18px;
      overflow: hidden;
      background: #0e1220;
      position: relative;
      width: 100%;
    }

    .auth-carousel-track {
      display: grid;
      grid-template-columns: repeat(3, 100%);
      transition: transform 0.5s ease;
    }

    .auth-carousel-slide {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    .auth-carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .auth-carousel-dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0.55rem;
      display: flex;
      justify-content: center;
      gap: 0.45rem;
    }

    .auth-carousel-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(8, 12, 24, 0.6);
      cursor: pointer;
      padding: 0;
    }

    .auth-carousel-dot.active {
      background: #2aa8f4;
      border-color: #2aa8f4;
      box-shadow: 0 0 0 3px rgba(42, 168, 244, 0.18);
    }

    .auth-rating {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #dbe7ff;
      font-size: 0.92rem;
      text-align: center;
    }

    .auth-stars {
      color: #f7c06d;
      letter-spacing: 0.06em;
      font-size: 0.95rem;
    }

    .auth-text-carousel {
      width: 100%;
      border: 1px solid #27324b;
      border-radius: 14px;
      background: rgba(16, 20, 32, 0.7);
      padding: 0.8rem 0.9rem;
      text-align: center;
      min-height: 72px;
      position: relative;
      overflow: hidden;
    }

    .auth-text-slide {
      display: none;
    }

    .auth-text-slide.active {
      display: block;
    }

    .auth-text-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
    }

    .auth-text-sub {
      margin-top: 0.2rem;
      color: #a8b5d9;
      font-size: 0.92rem;
    }

    .panel {
      background: linear-gradient(150deg, rgba(22, 24, 38, 0.95), rgba(15, 17, 27, 0.95));
      border: 1px solid #252a3a;
      border-radius: 16px;
      padding: 1rem;
    }

    .brand-row { display: flex; align-items: center; gap: 0.65rem; }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(160deg, #2cc2ff, #0f8dcc);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(24, 181, 255, 0.35);
    }

    .brand-logo svg { width: 25px; height: 25px; }

    h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2rem); }

    .auth-sub { margin: 0.45rem 0 0; color: var(--muted); }

    label { display: block; margin-top: 0.8rem; color: #d6dbef; font-size: 0.95rem; }

    input, button {
      font: inherit;
      color: var(--text);
    }

    .field {
      width: 100%;
      margin-top: 0.35rem;
      border: 1px solid #353b54;
      border-radius: 12px;
      padding: 0.72rem 0.78rem;
      background: #20243a;
      color: var(--text);
    }

    .field:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(24, 181, 255, 0.2);
    }

    .btn {
      margin-top: 0.95rem;
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 0.78rem;
      cursor: pointer;
      font-weight: 600;
      background: linear-gradient(135deg, #18b5ff, #068cd7);
      color: white;
    }

    .status { margin-top: 0.7rem; min-height: 1.1rem; font-size: 0.95rem; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.75rem;
    }

    .welcome { color: var(--muted); font-size: 0.88rem; margin-top: 0.15rem; }

    .logout-btn {
      border: 1px solid #3a405a;
      background: #21263a;
      color: #f2f4ff;
      border-radius: 12px;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid #383d50;
      border-radius: 14px;
      background: #11131d;
      padding: 0.55rem 0.65rem;
    }

    .search-wrap input {
      flex: 1;
      background: transparent;
      border: 0;
      color: #e8ebf9;
      font-size: 1.02rem;
    }

    .search-wrap input:focus { outline: none; }
    .search-wrap input::placeholder { color: #757c99; }

    .search-icon {
      border: 0;
      background: transparent;
      color: #9ea5c5;
      font-size: 1.2rem;
      line-height: 1;
      padding: 0;
    }

    .upload-card {
      margin-top: 0.85rem;
      width: 100%;
      border: 1px solid #31364b;
      border-radius: 14px;
      background: #11141f;
      color: #ecf0ff;
      padding: 1.05rem 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.32rem;
      cursor: pointer;
    }

    .upload-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      border: 1px solid #3a4057;
      background: #1e2438;
      font-size: 1.15rem;
    }

    .upload-text { font-size: 1.22rem; font-weight: 500; }

    .group-date {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #9aa2bf;
      font-weight: 600;
      margin: 1.2rem 0 0.75rem;
      font-size: 1.05rem;
    }

    .group-date::before, .group-date::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2a3042;
    }

    .file-card {
      border-top: 1px solid #23293b;
      padding: 1rem 0 2.6rem;
      position: relative;
    }

    .file-name {
      margin: 0;
      font-size: clamp(1.1rem, 4vw, 1.45rem);
      line-height: 1.25;
      word-break: break-word;
    }

    .file-meta {
      margin-top: 0.3rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .chapter-meta {
      margin-top: 0.45rem;
      color: #cbd6f5;
      font-size: 0.9rem;
    }

    .more-link {
      position: absolute;
      right: 0;
      bottom: 0.05rem;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      border: 1px solid #324268;
      border-radius: 999px;
      background: #1a2236;
      color: #dbe7ff;
      padding: 0.28rem 0.6rem;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .more-arrow {
      font-size: 0.95rem;
      line-height: 1;
      color: #7fb8ff;
    }

    .file-actions {
      margin-top: 0.92rem;
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
    }

    .action-btn {
      border: 0;
      background: transparent;
      color: #f3f4ff;
      cursor: pointer;
      padding: 0;
      display: grid;
      justify-items: center;
      gap: 0.4rem;
      min-width: 94px;
      align-content: start;
    }

    .action-icon-slot {
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
    }

    .hex {
      width: 70px;
      height: 76px;
      clip-path: polygon(50% 0%, 92% 24%, 92% 76%, 50% 100%, 8% 76%, 8% 24%);
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.45rem;
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .hex-icon {
      width: 30px;
      height: 30px;
    }

    .hex.quick { background: linear-gradient(145deg, #d89332, #b9741e); }
    .hex.practice { background: linear-gradient(145deg, #3aa7f2, #1f75bd); }
    .hex.review { background: linear-gradient(145deg, #56c93a, #3b9f24); }
    .hex.analytics { background: linear-gradient(145deg, #7c6cf4, #4e3bc8); }

    .practice-frame {
      --progress: 0;
      position: relative;
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
    }

    .progress-ring {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: conic-gradient(#4cd964 calc(var(--progress) * 1%), #29a8ff 0);
      box-shadow: 0 0 0 2px rgba(41, 168, 255, 0.35);
    }

    .progress-ring::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 999px;
      background: #0f1524;
    }

    .practice-frame .hex.practice {
      position: relative;
      z-index: 2;
      width: 64px;
      height: 70px;
      font-size: 1.35rem;
    }

    .action-label { font-size: 1.05rem; font-weight: 600; }
    .action-sub { font-size: 0.76rem; color: #a6add2; margin-top: -0.12rem; }

    .empty-text {
      color: var(--muted);
      margin-top: 1rem;
      text-align: center;
    }

    .tab-pane.hidden { display: none !important; }

    .practice-tab-wrap {
      margin-top: 0.35rem;
    }

    .practice-select {
      width: 100%;
      border: 1px solid #3a4260;
      border-radius: 12px;
      background: #1d2438;
      color: #eef3ff;
      padding: 0.68rem 0.72rem;
      font: inherit;
      margin-bottom: 0.9rem;
    }

    .practice-topic-list {
      margin-top: 0.2rem;
      display: grid;
      gap: 0.9rem;
    }

    .practice-picker-btn {
      width: 100%;
      border: 1px solid #395079;
      border-radius: 13px;
      background: linear-gradient(160deg, #1f2f53, #192743);
      color: #eef3ff;
      padding: 0.7rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      cursor: pointer;
      text-align: left;
      margin-bottom: 0.8rem;
    }

    .practice-picker-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
    }

    .practice-picker-meta {
      margin-top: 0.2rem;
      color: #a8b5d9;
      font-size: 0.86rem;
    }

    .practice-picker-caret {
      color: #9eb2df;
      font-size: 0.9rem;
      flex: 0 0 auto;
    }

    .practice-topic-card {
      border: 1px solid #28314a;
      border-radius: 13px;
      background: linear-gradient(150deg, rgba(26, 31, 48, 0.92), rgba(18, 22, 34, 0.92));
      padding: 0.82rem;
    }

    .practice-topic-title {
      margin: 0;
      font-size: 1.06rem;
      line-height: 1.3;
    }

    .practice-topic-meta {
      margin-top: 0.3rem;
      color: #a6afce;
      font-size: 0.86rem;
    }

    .practice-topic-actions {
      margin-top: 0.7rem;
      display: flex;
      gap: 0.8rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .practice-card-header {
      margin-bottom: 0.6rem;
      border-bottom: 1px solid #2d3653;
      padding-bottom: 0.55rem;
    }

    .practice-card-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.3;
    }

    .practice-card-meta {
      margin-top: 0.2rem;
      color: #a7b2d3;
      font-size: 0.84rem;
    }

    .journey-wrap {
      border: 1px solid #28314a;
      border-radius: 12px;
      background: rgba(19, 26, 42, 0.65);
      padding: 0.5rem 0.5rem 0.6rem;
    }

    .journey-stage {
      position: relative;
      height: 228px;
    }

    .journey-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .track-btn {
      min-width: 0;
      width: 96px;
      position: relative;
      z-index: 1;
      gap: 0.28rem;
      position: absolute;
    }

    .track-btn .action-icon-slot {
      width: 86px;
      height: 82px;
    }

    .track-btn .hex.practice {
      width: 62px;
      height: 68px;
      font-size: 1.22rem;
    }

    .track-btn .action-label {
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.1;
    }

    .journey-dot {
      fill: #79c9ff;
      opacity: 0.95;
    }

    .track-easy .hex.practice { background: linear-gradient(145deg, #56c93a, #3b9f24); }
    .track-medium .hex.practice { background: linear-gradient(145deg, #3aa7f2, #1f75bd); }
    .track-hard .hex.practice { background: linear-gradient(145deg, #9656f2, #6730b9); }
    .track-pyqs .hex.practice { background: linear-gradient(145deg, #cf8b2d, #9b651f); }
    .track-test .hex.practice { background: linear-gradient(145deg, #e4546d, #b92f50); }

    .track-easy { left: 4px; top: 0; }
    .track-medium { right: 4px; top: 0; }
    .track-hard { left: 50%; transform: translateX(-50%); top: 72px; }
    .track-pyqs { left: 4px; bottom: 0; }
    .track-test { right: 4px; bottom: 0; }

    .practice-empty {
      color: #aab4d4;
      font-size: 0.92rem;
      padding: 0.65rem 0.1rem;
    }

    .picker-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(5, 7, 12, 0.72);
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .picker-modal {
      width: min(560px, 95vw);
      max-height: min(78vh, 620px);
      overflow: auto;
      border: 1px solid #334775;
      border-radius: 14px;
      background: linear-gradient(165deg, #131b30 0%, #101725 100%);
      padding: 0.9rem;
    }

    .picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-bottom: 0.65rem;
    }

    .picker-title {
      margin: 0;
      font-size: 1.04rem;
    }

    .picker-close {
      border: 1px solid #445682;
      background: #1f2a45;
      color: #eff4ff;
      border-radius: 10px;
      padding: 0.32rem 0.54rem;
      cursor: pointer;
      font: inherit;
      font-size: 0.86rem;
    }

    .picker-section {
      margin-top: 0.75rem;
    }

    .picker-subject {
      margin: 0;
      font-size: 0.92rem;
      color: #c9d8ff;
      font-weight: 600;
    }

    .picker-chapters {
      margin-top: 0.45rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .picker-chip {
      border: 1px solid #40537f;
      border-radius: 999px;
      background: #1c2743;
      color: #e7ecff;
      padding: 0.36rem 0.64rem;
      font: inherit;
      font-size: 0.83rem;
      cursor: pointer;
      line-height: 1.2;
    }

    .picker-chip.active {
      border-color: #4ac0ff;
      background: #20456e;
      box-shadow: inset 0 0 0 1px rgba(77, 193, 255, 0.35);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      border-top: 1px solid #2d3551;
      background: rgba(10, 14, 24, 0.97);
      backdrop-filter: blur(6px);
      padding: 0.55rem 0.8rem calc(0.55rem + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.6rem;
    }

    .bottom-btn {
      border: 1px solid #3a4260;
      border-radius: 12px;
      background: #1a2237;
      color: #dbe4ff;
      padding: 0.62rem 0.5rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .bottom-btn.active {
      border-color: #2aa8f4;
      background: #223d63;
      color: #eff6ff;
      box-shadow: inset 0 0 0 1px rgba(47, 155, 240, 0.35);
    }

    .chat-fab {
      position: fixed;
      right: 1rem;
      bottom: 4.8rem;
      z-index: 25;
      border: 0;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2f9bf0, #2377bc);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(35, 119, 188, 0.35);
    }

    .chat-fab svg {
      width: 34px;
      height: 34px;
    }

    .onboard-title {
      margin: 0;
      font-size: clamp(1.25rem, 4.8vw, 1.95rem);
      line-height: 1.25;
    }

    .onboard-hero {
      text-align: center;
      min-height: 64px;
      display: grid;
      place-items: center;
      margin-bottom: 0.4rem;
    }

    .onboard-hero-text {
      font-size: clamp(1.2rem, 4.6vw, 1.75rem);
      font-weight: 700;
      color: #e9f1ff;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .onboard-hero-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    .onboarding-wrap.intro-mode {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0 auto;
    }

    .onboarding-wrap.intro-mode .panel {
      background: transparent;
      border: 0;
      padding: 0;
      box-shadow: none;
    }

    .onboarding-wrap.intro-mode .onboard-hero {
      min-height: 120px;
    }

    .onboarding-wrap.intro-mode .onboard-title,
    .onboarding-wrap.intro-mode .onboard-meta,
    .onboarding-wrap.intro-mode .onboard-options,
    .onboarding-wrap.intro-mode .onboard-footer {
      display: none;
    }

    .onboard-meta {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .onboard-options {
      margin-top: 0.95rem;
      display: grid;
      gap: 0.65rem;
    }

    .onboard-options {
      transition: opacity 0.4s ease;
    }

    .onboard-option {
      width: 100%;
      border: 1px solid #394161;
      border-radius: 12px;
      background: #1c2339;
      color: #ecf1ff;
      text-align: left;
      padding: 0.72rem 0.76rem;
      cursor: pointer;
      font: inherit;
      transition: border-color 0.12s ease, background-color 0.12s ease;
    }

    .onboard-option:hover {
      border-color: #6ea9eb;
    }

    .onboard-option.selected {
      border-color: #43b4ff;
      background: #21395e;
      box-shadow: inset 0 0 0 1px rgba(67, 180, 255, 0.3);
    }

    .onboard-footer {
      margin-top: 1rem;
      display: flex;
      justify-content: flex-end;
    }


    .mascot {
      position: fixed;
      left: 0.6rem;
      bottom: 0.3rem;
      z-index: 12;
      width: clamp(140px, 30vw, 220px);
      height: clamp(220px, 45vh, 320px);
      pointer-events: none;
      filter: drop-shadow(0 12px 22px rgba(36, 136, 255, 0.28));
      animation: mascot-float 3.6s ease-in-out infinite;
    }

    .mascot.age-step {
      left: auto;
      right: 0.6rem;
    }

    .mascot.hidden {
      display: none;
    }

    .mascot svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .mascot-tail {
      transform-origin: 70px 66px;
      animation: tail-sway 1.8s ease-in-out infinite;
    }

    .mascot-glow {
      animation: glow-pulse 2.8s ease-in-out infinite;
    }

    @keyframes mascot-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes tail-sway {
      0%, 100% { transform: rotate(6deg); }
      50% { transform: rotate(-10deg); }
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.9; }
    }

    .onboard-next {
      border: 0;
      border-radius: 11px;
      padding: 0.62rem 0.95rem;
      background: linear-gradient(135deg, #18b5ff, #068cd7);

  <script>

    const fileGroupsEl = document.getElementById("fileGroups");
    const emptyState = document.getElementById("emptyState");
    const tabStudyBtn = document.getElementById("tabStudyBtn");
    const goPracticeBtn = document.getElementById("goPracticeBtn");
    const goTestSeriesBtn = document.getElementById("goTestSeriesBtn");
    const onboardingTitle = document.getElementById("onboardingTitle");
    const onboardingHeroText = document.getElementById("onboardingHeroText");
    const onboardingMeta = document.getElementById("onboardingMeta");

    let currentUser = null;

    let onboardingAnswers = {
      age_group: "",
      exam_target: "",
      daily_practice_time: "",
      start_subject: ""
    };
    let onboardingVoicePlayed = false;
    let lastSpokenStepKey = "";
    let carouselIndex = 0;
    let carouselTimer = null;
    let authTextIndex = 0;
    let authTextTimer = null;
    let voiceReady = false;
    let examIntroState = "idle";
    let examIntroTimers = [];

    const onboardingSteps = [
      {
        key: "age_group",
        title: "Select your age",
        options: ["Below 10", "10-15", "16-20", "21-30", "31-50", "50+"]
      },
      {
        key: "exam_target",
        title: "What are you preparing for?",
        options: ["JEE", "NEET (UG)"]
      },
      {
        key: "daily_practice_time",
        title: "How much are you willing to spend on practice everyday?",
        options: ["Less than 2 hours", "2 to 6 hours", "More than 6 hours"]
      },
      {
        key: "start_subject",
        title: "Which subject would you like to start with?",
        options: []
      }
    ];

    function normalizeExam(value) {
      return String(value || "").replace(/\(.*?\)/g, "").trim().toUpperCase();
    }

    const stopWords = new Set([
      "the", "and", "for", "with", "that", "this", "from", "into", "your", "their", "there", "which", "about", "were", "when", "where",
      "have", "has", "had", "been", "being", "also", "than", "then", "because", "while", "after", "before", "over", "under", "between",
      "through", "during", "such", "each", "some", "many", "more", "most", "other", "those", "these", "they", "them", "will", "would",
      "should", "could", "might", "must", "is", "are", "was", "be", "to", "of", "in", "on", "at", "by", "as", "an", "a", "or", "it"
    ]);

    const fmtDate = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });
    const curriculumCatalog = window.curriculumData && window.curriculumData.catalog ? window.curriculumData.catalog : {};
    const jeeChapters = (() => {
      const out = [];
      const jee = curriculumCatalog && typeof curriculumCatalog.JEE === "object" ? curriculumCatalog.JEE : {};
      for (const [subject, chapters] of Object.entries(jee)) {
        if (!Array.isArray(chapters)) continue;
        for (const chapter of chapters) {
          const needle = String(chapter || "")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, " ")
            .replace(/\s+/g, " ")
            .trim();
          if (needle) {
            out.push({ subject, chapter, needle });
          }
        }
      }
      return out.sort((a, b) => b.needle.length - a.needle.length);
    })();

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    function setAuthStatus(message, type = "") {
      authStatusEl.textContent = message;
      authStatusEl.className = `status ${type}`.trim();
    }

    function setOnboardingStatus(message, type = "") {
      onboardingStatus.textContent = message;
      onboardingStatus.className = `status ${type}`.trim();
    }

    function setActiveTab() {
      tabStudyBtn.classList.add("active");
      goPracticeBtn.classList.remove("active");
      goTestSeriesBtn.classList.remove("active");
    }

    function displayNameWithoutExtension(fileName) {
      return String(fileName || "").replace(/\.[^./\\]+$/, "");
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function cleanText(raw) {
      return raw.replace(/\r/g, " ").replace(/\s+/g, " ").replace(/[\u0000-\u001F]+/g, " ").trim();
    }

    function normalizeForMatch(raw) {
      return String(raw || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function findRelatedChapter(text) {
      const normalized = normalizeForMatch(text);
      if (normalized) {
        for (const item of jeeChapters) {
          if (normalized.includes(item.needle)) {
            return { subject: item.subject, chapter: item.chapter };
          }
        }
      }
      return null;
    }

    function resolveRelatedChapter(file) {
      const direct = findRelatedChapter(file.text || "");
      if (direct) return direct;
      const fromName = findRelatedChapter(file.name || "");
      if (fromName) return fromName;
      return jeeChapters.length ? { subject: jeeChapters[0].subject, chapter: jeeChapters[0].chapter } : null;
    }

    function splitSentences(text) {
      return text.split(/(?<=[.!?])\s+/).map((s) => s.trim()).filter((s) => s.length > 40 && s.length < 240);
    }

    function pickKeyword(sentence) {
      const words = sentence.toLowerCase().replace(/[^a-z0-9\s-]/g, "").split(/\s+/).filter((w) => w.length > 3 && !stopWords.has(w));
      if (!words.length) return null;
      words.sort((a, b) => b.length - a.length);
      return words[0];
    }

    function unique(array) {
      return [...new Set(array)];
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function toMcqQuestion(sentence, keyword, keywordPool) {
      const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(`\\b${escaped}\\b`, "i");
      if (!regex.test(sentence)) return null;

      const prompt = sentence.replace(regex, "_____");
      const distractors = shuffle(keywordPool.filter((k) => k !== keyword)).slice(0, 3);
      if (distractors.length < 3) return null;

      return {
        prompt,
        answer: keyword,
        choices: shuffle([keyword, ...distractors])
      };
    }

    function generateMcqQuestionsFromText(text, count = 10) {
      const cleaned = cleanText(text);
      const sentences = splitSentences(cleaned);
      if (sentences.length < 3) return { error: "Not enough usable sentence content in the uploaded file." };

      const sentenceKeywords = sentences.map((sentence) => ({ sentence, keyword: pickKeyword(sentence) })).filter((item) => item.keyword);
      if (sentenceKeywords.length < 3) return { error: "Could not extract enough keywords from the uploaded file." };

      const keywordPool = unique(sentenceKeywords.map((item) => item.keyword));
      if (keywordPool.length < 4) return { error: "Need more varied vocabulary to generate MCQ questions." };

      const candidates = shuffle(sentenceKeywords);
      const output = [];
      let safety = 0;

      while (output.length < count && safety < count * 12) {
        const candidate = candidates[safety % candidates.length];
        const question = toMcqQuestion(candidate.sentence, candidate.keyword, keywordPool);
        if (question) output.push(question);
        safety += 1;
      }

      if (!output.length) return { error: "No MCQ questions could be generated from this file." };

      if (output.length < count) {
        const seed = [...output];
        let i = 0;
        while (output.length < count) {
          const base = seed[i % seed.length];
          output.push({ prompt: base.prompt, answer: base.answer, choices: shuffle([...base.choices]) });
          i += 1;
        }
      }

      return { questions: output.slice(0, count) };
    }

    async function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Failed to read file."));
        reader.readAsText(file);
      });
    }

    async function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Failed to read PDF file."));
        reader.readAsArrayBuffer(file);
      });
    }

    async function extractTextFromPdf(file) {
      if (typeof pdfjsLib === "undefined") {
        throw new Error("PDF engine failed to load. Use a local server and try again.");
      }

      const pdfData = await readFileAsArrayBuffer(file);
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const loadingTask = pdfjsLib.getDocument({ data: pdfData });
      const pdf = await loadingTask.promise;
      const pages = [];

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
        const page = await pdf.getPage(pageNumber);
        const content = await page.getTextContent();
        const pageText = content.items.map((item) => item.str).join(" ").trim();
        if (pageText) pages.push(pageText);
      }

      return pages.join(" ");
    }

    function showAuth() {
      onboardingRoot.classList.add("hidden");
      appRoot.classList.add("hidden");
      authRoot.classList.remove("hidden");
      if (mascotEl) mascotEl.classList.add("hidden");
      if (chatFab) chatFab.classList.add("hidden");
      authForm.reset();
      setStatus("");
      setAuthStatus("");
      currentUser = null;
      currentFiles = [];
      progressByFileId = {};
      setActiveTab();
      onboardingUser = null;
      onboardingStep = 1;
      onboardingAnswers = { age_group: "", exam_target: "", daily_practice_time: "", start_subject: "" };
      startCarousel();
    }

    function renderOnboardingStep() {
      const step = onboardingSteps[onboardingStep - 1];
      if (!step) return;
      const isExamStep = step.key === "exam_target";
      if (!isExamStep || examIntroState !== "question") {
        examIntroTimers.forEach((t) => clearTimeout(t));
        examIntroTimers = [];
        examIntroState = "idle";
      }
      onboardingTitle.textContent = step.key === "exam_target"
        ? (examIntroState === "question" ? step.title : "")
        : step.title;
      onboardingMeta.textContent = "";
      onboardingNext.textContent = onboardingStep === onboardingSteps.length ? "Finish" : "Continue";
      onboardingNext.disabled = !onboardingAnswers[step.key];
      onboardingOptions.innerHTML = "";
      if (mascotEl) {
        mascotEl.classList.remove("hidden");
        mascotEl.classList.remove("age-step");
      }
      if (onboardingHeroText && (!isExamStep || examIntroState !== "question")) {
        onboardingHeroText.textContent = "";
        onboardingHeroText.classList.remove("show");
      }
      const optionsDisabled = step.key === "exam_target" && examIntroState !== "question";
      if (step.key === "exam_target") {
        onboardingOptions.style.opacity = examIntroState === "question" ? "1" : "0";
        onboardingOptions.style.pointerEvents = examIntroState === "question" ? "auto" : "none";
      } else {
        onboardingOptions.style.opacity = "1";
        onboardingOptions.style.pointerEvents = "auto";
      }
      const stepOptions = step.key === "start_subject"
        ? (normalizeExam(onboardingAnswers.exam_target) === "NEET"
          ? ["Biology", "Physics", "Chemistry"]
          : ["Maths", "Physics", "Chemistry"])
        : step.options;
      for (const option of stepOptions) {
        const btn = document.createElement("button");
        btn.type = "button";
        const selected = onboardingAnswers[step.key] === option;
        btn.className = `onboard-option ${selected ? "selected" : ""}`.trim();
        btn.textContent = option;
        btn.disabled = optionsDisabled;
        btn.addEventListener("click", () => {
          onboardingAnswers[step.key] = option;
          renderOnboardingStep();
        });
        onboardingOptions.appendChild(btn);
      }

      if (step.key !== lastSpokenStepKey) {
        lastSpokenStepKey = step.key;
        if (step.key === "exam_target") {
          runExamIntroSequence();
        } else {
          const message = step.key === "age_group"
            ? "Select your age"
            : step.key === "start_subject"
              ? "Okay Great! Now which subject would you like to start your preparation with?"
              : String(step.title || "");
          speakMascot(message);
        }
      }
    }

    function showOnboarding(user, existingOnboarding) {
      currentUser = user;
      onboardingUser = user;
      authRoot.classList.add("hidden");
      appRoot.classList.add("hidden");
      onboardingRoot.classList.remove("hidden");
      if (mascotEl) mascotEl.classList.remove("hidden");
      if (chatFab) chatFab.classList.add("hidden");
      onboardingAnswers = {
        age_group: existingOnboarding && existingOnboarding.age_group ? existingOnboarding.age_group : "",
        exam_target: existingOnboarding && existingOnboarding.exam_target ? existingOnboarding.exam_target : "",
        daily_practice_time: existingOnboarding && existingOnboarding.daily_practice_time ? existingOnboarding.daily_practice_time : "",
        start_subject: existingOnboarding && existingOnboarding.start_subject ? existingOnboarding.start_subject : ""
      };
      if (!onboardingAnswers.age_group) {
        onboardingStep = 1;
      } else if (!onboardingAnswers.exam_target) {
        onboardingStep = 2;
      } else if (!onboardingAnswers.daily_practice_time) {
        onboardingStep = 3;
      } else if (!onboardingAnswers.start_subject) {
        onboardingStep = 4;
      } else {
        onboardingStep = 4;
      }
      onboardingVoicePlayed = false;
      lastSpokenStepKey = "";
      examIntroState = "idle";
      if (chatFab) chatFab.classList.add("hidden");
      stopCarousel();
      stopAuthTextCarousel();
      setOnboardingStatus("");
      renderOnboardingStep();
    }


    function pickFemaleVoice(voices) {
      const list = Array.isArray(voices) ? voices : [];
      const preferred = list.find((v) => /female|woman|zira|samantha|victoria|karen|moira|tessa|siri/i.test(v.name || ""));
      return preferred || list.find((v) => /en/i.test(v.lang || "")) || list[0] || null;
    }

    function speakMascot(text) {
      if (typeof window === "undefined" || !window.speechSynthesis) return;
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const voice = pickFemaleVoice(voices);
      if (voice) {
        utterance.voice = voice;
        try {
          localStorage.setItem("techy_voice_name", voice.name || "");
        } catch {}
      }
      utterance.rate = 1;
      utterance.pitch = 1.05;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function runExamIntroSequence() {
      examIntroState = "intro";
      onboardingVoicePlayed = true;
      if (onboardingRoot) onboardingRoot.classList.add("intro-mode");
      if (onboardingHeroText) {
        onboardingHeroText.textContent = "";
        onboardingHeroText.classList.remove("show");
      }
      onboardingOptions.style.opacity = "0";
      onboardingOptions.style.pointerEvents = "none";
      onboardingOptions.querySelectorAll("button").forEach((btn) => {
        btn.disabled = true;
      });

      speakMascot("Hello I'm Techy, your problem solving friend");

      examIntroTimers.push(setTimeout(() => {
        examIntroState = "tagline";
        if (onboardingHeroText) {
          onboardingHeroText.textContent = "Your Problem Solving Friend";
          onboardingHeroText.classList.add("show");
        }
      }, 3000));

      examIntroTimers.push(setTimeout(() => {
        examIntroState = "question";
        if (onboardingRoot) onboardingRoot.classList.remove("intro-mode");
        if (onboardingHeroText) {
          onboardingHeroText.classList.remove("show");
          onboardingHeroText.textContent = "";
        }
        onboardingTitle.textContent = "What are you preparing for?";
        onboardingOptions.style.opacity = "1";
        onboardingOptions.style.pointerEvents = "auto";
        onboardingOptions.querySelectorAll("button").forEach((btn) => {
          btn.disabled = false;
        });
        speakMascot("What are you preparing for?");
      }, 6000));
    }

    if (typeof window !== "undefined" && window.speechSynthesis) {
      const ensureVoices = () => {
        if (voiceReady) return;
        const voices = window.speechSynthesis.getVoices();
        if (voices && voices.length) {
          voiceReady = true;
        }
      };
      window.speechSynthesis.addEventListener("voiceschanged", ensureVoices);
      ensureVoices();
    }

    function renderCarouselDots() {
      if (!authCarouselDots || !authCarouselTrack) return;
      const slides = authCarouselTrack.children.length;
      authCarouselDots.innerHTML = "";
      for (let i = 0; i < slides; i += 1) {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = `auth-carousel-dot ${i === carouselIndex ? "active" : ""}`.trim();
        dot.addEventListener("click", () => {
          carouselIndex = i;
          updateCarousel();
          restartCarouselTimer();
        });
        authCarouselDots.appendChild(dot);
      }
    }

    function updateCarousel() {
      if (!authCarouselTrack) return;
      authCarouselTrack.style.transform = `translateX(-${carouselIndex * 100}%)`;
      if (authCarouselDots) {
        Array.from(authCarouselDots.children).forEach((dot, idx) => {
          dot.classList.toggle("active", idx === carouselIndex);
        });
      }
    }

    function stopCarousel() {
      if (carouselTimer) {
        clearInterval(carouselTimer);
        carouselTimer = null;
      }
    }

    function restartCarouselTimer() {
      stopCarousel();
      carouselTimer = setInterval(() => {
        if (!authCarouselTrack) return;
        const total = authCarouselTrack.children.length || 1;
        carouselIndex = (carouselIndex + 1) % total;
        updateCarousel();
      }, 4200);
    }

    function startCarousel() {
      if (!authCarouselTrack) return;
      carouselIndex = 0;
      renderCarouselDots();
      updateCarousel();
      restartCarouselTimer();
      startAuthTextCarousel();
    }

    function stopAuthTextCarousel() {
      if (authTextTimer) {
        clearInterval(authTextTimer);
        authTextTimer = null;
      }
    }

    function startAuthTextCarousel() {
      const slides = Array.from(document.querySelectorAll(".auth-text-slide"));
      if (!slides.length) return;
      authTextIndex = 0;
      slides.forEach((slide, idx) => slide.classList.toggle("active", idx === authTextIndex));
      stopAuthTextCarousel();
      authTextTimer = setInterval(() => {
        authTextIndex = (authTextIndex + 1) % slides.length;
        slides.forEach((slide, idx) => slide.classList.toggle("active", idx === authTextIndex));
      }, 4200);
    }

    async function loadLibraryData() {
      if (!currentUser) return;
      const dbFiles = await api.listFiles(currentUser.id);
      currentFiles = dbFiles.map((row) => ({
        id: row.id,
        name: row.name,
        uploadedAt: row.uploaded_at,
        text: row.text_content,
        questions: Array.isArray(row.questions) ? row.questions : []
      }));
      const progressRows = await api.listProgressForFiles(currentUser.id, currentFiles.map((f) => f.id));
      progressByFileId = {};
      for (const row of progressRows) {
        progressByFileId[row.file_id] = row;
      }
    }

    async function showApp(user, onboardingData = null) {
      currentUser = user;
      authRoot.classList.add("hidden");
      onboardingRoot.classList.add("hidden");
      appRoot.classList.remove("hidden");
      if (mascotEl) mascotEl.classList.add("hidden");
      if (chatFab) chatFab.classList.remove("hidden");
      stopCarousel();
      stopAuthTextCarousel();
      welcomeText.textContent = `Signed in as ${user.email || "user"}`;
      setActiveTab();
      fileSearch.value = "";
      await loadLibraryData();
      renderFiles();
      setStatus("");
    }

    async function routeAfterLogin(user, isNewSignup = false) {
      let onboarding = null;
      try {
        onboarding = await api.getUserOnboarding(user.id);
      } catch {}
      const needsOnboarding = (isNewSignup && (!onboarding || !onboarding.completed_at))
        || Boolean(onboarding && !onboarding.completed_at);
      if (needsOnboarding) {
        showOnboarding(user, onboarding);
        return;
      }
      await showApp(user, onboarding);
    }

    function getAttemptedCount(fileId) {
      const row = progressByFileId[fileId];
      return new Set(row && Array.isArray(row.practice_attempted) ? row.practice_attempted : []).size;
    }

    function getCorrectCount(fileId) {
      const row = progressByFileId[fileId];
      return new Set(row && Array.isArray(row.practice_correct) ? row.practice_correct : []).size;
    }

    function renderFiles() {
      const query = fileSearch.value.trim().toLowerCase();
      const files = [...currentFiles]
        .filter((file) => file.name.toLowerCase().includes(query))
        .sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));

      fileGroupsEl.innerHTML = "";
      emptyState.classList.toggle("hidden", files.length > 0);
      if (!files.length) return;

      const groups = new Map();
      for (const file of files) {
        const key = new Date(file.uploadedAt).toISOString().slice(0, 10);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(file);
      }

      for (const [key, groupFiles] of groups.entries()) {
        const heading = document.createElement("div");
        heading.className = "group-date";
        heading.textContent = fmtDate.format(new Date(key));
        fileGroupsEl.appendChild(heading);

        for (const file of groupFiles) {
          const card = document.createElement("article");
          card.className = "file-card";

          const name = document.createElement("h3");
          name.className = "file-name";
          name.textContent = displayNameWithoutExtension(file.name);

          card.appendChild(name);

          const related = resolveRelatedChapter(file);
          if (related) {
            const meta = document.createElement("div");
            meta.className = "chapter-meta";
            meta.textContent = `${related.subject} • ${related.chapter}`;
            card.appendChild(meta);

            const link = document.createElement("button");
            link.type = "button";
            link.className = "more-link";
            link.innerHTML = `<span>Know More</span><span class="more-arrow">&#10140;</span>`;
            link.addEventListener("click", () => {
              const url = `practice-hub.html?exam=JEE&subject=${encodeURIComponent(related.subject)}&chapter=${encodeURIComponent(related.chapter)}`;
              window.location.href = url;
            });
            card.appendChild(link);
          }

          const actions = document.createElement("div");
          actions.className = "file-actions";

          const quickBtn = document.createElement("button");
          quickBtn.className = "action-btn";
          quickBtn.type = "button";
          quickBtn.innerHTML = '<span class="action-icon-slot"><span class="hex quick">&#128214;</span></span><span class="action-label">Quick Review</span>';
          quickBtn.addEventListener("click", () => {
            window.location.href = `review.html?id=${encodeURIComponent(file.id)}`;
          });

          const attemptedCount = getAttemptedCount(file.id);
          const correctCount = getCorrectCount(file.id);
          const progressPercent = Math.round((attemptedCount / 10) * 100);
          const isMastered = correctCount >= 10;

          const practiceBtn = document.createElement("button");
          practiceBtn.className = "action-btn";
          practiceBtn.type = "button";
          if (isMastered) {
            practiceBtn.innerHTML = '<span class="action-icon-slot"><span class="hex review">&#11088;</span></span><span class="action-label">Review</span>';
            practiceBtn.addEventListener("click", () => {
              window.location.href = `practice.html?id=${encodeURIComponent(file.id)}&mode=review`;
            });
          } else {
            practiceBtn.innerHTML = `<span class="action-icon-slot"><span class="practice-frame" style="--progress:${progressPercent};"><span class="progress-ring" aria-hidden="true"></span><span class="hex practice">&#9654;</span></span></span><span class="action-label">Practice</span>`;
            practiceBtn.addEventListener("click", () => {
              window.location.href = `practice.html?id=${encodeURIComponent(file.id)}&mode=practice`;
            });
          }

          actions.append(quickBtn, practiceBtn);
          const analyticsBtn = document.createElement("button");
          analyticsBtn.className = "action-btn";
          analyticsBtn.type = "button";
          analyticsBtn.innerHTML = '<span class="action-icon-slot"><span class="hex analytics"><svg class="hex-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 17.2 L8.4 12.6 L12.2 15.5 L18.4 9.1" stroke="#E9F4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.4" cy="12.6" r="1.4" fill="#E9F4FF"/><circle cx="12.2" cy="15.5" r="1.4" fill="#E9F4FF"/><circle cx="18.4" cy="9.1" r="1.4" fill="#E9F4FF"/><path d="M6.2 6.2 L6.2 4.4" stroke="#E9F4FF" stroke-width="1.6" stroke-linecap="round"/><path d="M4.4 6.2 L6.2 6.2" stroke="#E9F4FF" stroke-width="1.6" stroke-linecap="round"/><path d="M19.6 17.6 L19.6 15.8" stroke="#E9F4FF" stroke-width="1.6" stroke-linecap="round"/><path d="M18.0 16.7 L21.2 16.7" stroke="#E9F4FF" stroke-width="1.6" stroke-linecap="round"/></svg></span></span><span class="action-label">Analytics</span>';
          analyticsBtn.addEventListener("click", () => {
            window.location.href = `analytics.html?id=${encodeURIComponent(file.id)}`;
          });
          actions.appendChild(analyticsBtn);
          card.appendChild(actions);
          fileGroupsEl.appendChild(card);
        }
      }
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!api || !api.isConfigured()) {
        setAuthStatus("Supabase is not configured. Set values in supabase-config.js", "error");
        return;
      }

      const email = authEmail.value.trim().toLowerCase();
      const password = authPassword.value;

      if (!isValidEmail(email) || !password) {
        setAuthStatus("Enter both email and password.", "error");
        return;
      }

      if (password.length < 8) {
        setAuthStatus("Password must be at least 8 characters.", "error");
        return;
      }

      try {
        const result = await api.signInOrCreate(email, password);
        if (!result.ok) {
          if (result.reason === "wrong_password") {
            setAuthStatus("Wrong password.", "error");
            return;
          }
          if (result.reason === "email_confirmation_required") {
            setAuthStatus("Enable auto-confirm in Supabase Auth or confirm this email first.", "error");
            return;
          }
          setAuthStatus(result.error?.message || "Login failed.", "error");
          return;
        }
        authForm.reset();
        setAuthStatus(result.created ? "Account created and signed in." : "", result.created ? "ok" : "");
        try { localStorage.setItem("teachmint_last_user", email); } catch {}
        await routeAfterLogin(result.user, result.created);
      } catch (err) {
        setAuthStatus(err.message || "Login failed.", "error");
      }
    });

    onboardingNext.addEventListener("click", async () => {
      if (!api || !api.isConfigured() || !onboardingUser) return;
      const step = onboardingSteps[onboardingStep - 1];
      if (!step || !onboardingAnswers[step.key]) return;

      onboardingNext.disabled = true;
      setOnboardingStatus("");
      try {
        if (onboardingStep === 1) {
          await api.upsertUserOnboarding(onboardingUser.id, {
            age_group: onboardingAnswers.age_group,
            exam_target: null,
            daily_practice_time: null,
            start_subject: null,
            completed_at: null
          });
          onboardingStep = 2;
          renderOnboardingStep();
          return;
        }

        if (onboardingStep === 2) {
          await api.upsertUserOnboarding(onboardingUser.id, {
            age_group: onboardingAnswers.age_group,
            exam_target: onboardingAnswers.exam_target,
            daily_practice_time: null,
            start_subject: null,
            completed_at: null
          });
          onboardingStep = 3;
          renderOnboardingStep();
          return;
        }

        if (onboardingStep === 3) {
          await api.upsertUserOnboarding(onboardingUser.id, {
            age_group: onboardingAnswers.age_group,
            exam_target: onboardingAnswers.exam_target,
            daily_practice_time: onboardingAnswers.daily_practice_time,
            start_subject: null,
            completed_at: null
          });
          onboardingStep = 4;
          renderOnboardingStep();
          return;
        }

        await api.upsertUserOnboarding(onboardingUser.id, {
          age_group: onboardingAnswers.age_group,
          exam_target: onboardingAnswers.exam_target,
          daily_practice_time: onboardingAnswers.daily_practice_time,
          start_subject: onboardingAnswers.start_subject,
          completed_at: new Date().toISOString()
        });
        try {
          localStorage.removeItem(`teachmint_chat_state_v1:${onboardingUser.id}`);
        } catch {}
        window.location.href = "chat.html";
      } catch (err) {
        setOnboardingStatus(err.message || "Could not save onboarding. Try again.", "error");
      } finally {
        if (onboardingRoot.classList.contains("hidden")) {
          onboardingNext.disabled = false;
        } else {
          const currentStep = onboardingSteps[onboardingStep - 1];
          onboardingNext.disabled = !currentStep || !onboardingAnswers[currentStep.key];
        }
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        if (api && api.isConfigured()) {
          await api.signOut();
        }
      } catch {}
      showAuth();
    });

    tabStudyBtn.addEventListener("click", () => setActiveTab());
    goPracticeBtn.addEventListener("click", () => {
      window.location.href = "practice-hub.html";
    });
    goTestSeriesBtn.addEventListener("click", () => {
      window.location.href = "test-series.html";
    });

    fileSearch.addEventListener("input", renderFiles);

    if (chatFab) {
      chatFab.addEventListener("click", () => {
        try {
          sessionStorage.setItem("chat_return_to", window.location.pathname.split("/").pop() || "index.html");
        } catch {}
        window.location.href = "chat.html";
      });
    }

    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      fileInput.value = "";
      if (!file || !currentUser) return;
      if (!api || !api.isConfigured()) {
        setStatus("Supabase is not configured. Set values in supabase-config.js", "error");
        return;
      }

      setStatus("Uploading and generating 10 MCQ questions...");
      uploadBtn.disabled = true;

      try {
        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        const extractedText = isPdf ? await extractTextFromPdf(file) : await readFileAsText(file);

        if (!extractedText.trim()) {
          setStatus("This file has no readable text content.", "error");
          return;
        }

        const generated = generateMcqQuestionsFromText(extractedText, 10);
        if (generated.error) {
          setStatus(generated.error, "error");
          return;
        }

        await api.createFile(currentUser.id, {
          id: (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function")
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2, 10)}`,
          name: file.name,
          uploaded_at: new Date().toISOString(),
          text_content: extractedText,
          questions: generated.questions
        });

        await loadLibraryData();
        renderFiles();
        setStatus(`Uploaded ${file.name}. Generated 10 MCQ questions.`, "ok");
      } catch (err) {
        setStatus(err.message || "Failed to process uploaded file.", "error");
      } finally {
        uploadBtn.disabled = false;
      }
    });

    async function init() {
      showAuth();
      if (!api || !api.isConfigured()) {
        setAuthStatus("Configure Supabase URL and key in supabase-config.js", "error");
        return;
      }
      try {
        const user = await api.getCurrentUser();
        if (user) {
          await routeAfterLogin(user, false);
        } else {
          showAuth();
        }
      } catch (err) {
        setAuthStatus(err.message || "Failed to initialize session.", "error");
      }
    }

    init();
  </script>
</body>
</html>
