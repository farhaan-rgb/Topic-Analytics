<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Test Scores - Teachmint</title>
  <style>
    :root {
      --bg: #07080f;
      --panel: #0f111b;
      --line: #2a2f41;
      --text: #f2f4ff;
      --muted: #99a0bc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% -5%, #203066 0%, transparent 45%),
        linear-gradient(160deg, #07080f 0%, #0a0d1a 60%, #080a13 100%);
      min-height: 100vh;
      padding: 1rem 1rem 4rem;
    }
    .wrap {
      width: min(760px, 94vw);
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.9rem;
    }
    .back {
      border: 1px solid #4a6380;
      background: rgba(16, 34, 56, 0.85);
      color: #eef4ff;
      border-radius: 11px;
      padding: 0.5rem 0.72rem;
      text-decoration: none;
      font-size: 0.92rem;
    }
    .title {
      margin: 0;
      font-size: clamp(1.2rem, 4vw, 1.7rem);
    }
    .section {
      border: 1px solid #2b3653;
      border-radius: 12px;
      background: linear-gradient(165deg, rgba(21, 29, 47, 0.95), rgba(14, 20, 34, 0.95));
      padding: 0.85rem;
      margin-bottom: 0.9rem;
    }
    .section h3 {
      margin: 0 0 0.6rem;
      font-size: 0.98rem;
      color: #cfe0ff;
    }
    .score-list {
      display: grid;
      gap: 0.55rem;
    }
    .score-row {
      border: 1px solid #34426a;
      border-radius: 10px;
      padding: 0.6rem 0.65rem;
      background: rgba(20, 28, 44, 0.85);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      align-items: center;
      font-size: 0.85rem;
      color: #dbe4ff;
    }
    .score-row .score-meta {
      color: #9fb0d6;
      font-size: 0.78rem;
      margin-top: 0.2rem;
    }
    .empty {
      border: 1px dashed #3b4666;
      border-radius: 10px;
      padding: 0.8rem;
      color: #a8b5d9;
      text-align: center;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" id="backBtn" href="test-series.html">Back</a>
      <h1 class="title">Mock Test Scores</h1>
      <span></span>
    </div>

    <section class="section">
      <h3>Public Mock Tests</h3>
      <div id="publicScores" class="score-list"></div>
    </section>
    <section class="section">
      <h3>Custom Mock Tests</h3>
      <div id="customScores" class="score-list"></div>
    </section>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const exam = (params.get("exam") || "JEE").trim().toUpperCase();
    const backBtn = document.getElementById("backBtn");
    backBtn.href = `test-series.html?exam=${encodeURIComponent(exam)}`;

    function loadHistory() {
      try {
        const historyRaw = JSON.parse(localStorage.getItem("teachmint_test_history_v1") || "{}");
        const userKey = (localStorage.getItem("teachmint_last_user") || "Learner").toLowerCase();
        return Array.isArray(historyRaw[userKey]) ? historyRaw[userKey] : [];
      } catch {
        return [];
      }
    }

    function renderScores() {
      const publicList = document.getElementById("publicScores");
      const customList = document.getElementById("customScores");
      publicList.innerHTML = "";
      customList.innerHTML = "";

      const history = loadHistory().filter((h) => String(h.exam || "").toUpperCase() === exam);
      const publics = history.filter((h) => !h.is_custom).slice(-12).reverse();
      const customs = history.filter((h) => h.is_custom).slice(-12).reverse();

      const render = (list, items) => {
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No attempts yet.";
          list.appendChild(empty);
          return;
        }
        for (const item of items) {
          const row = document.createElement("div");
          row.className = "score-row";
          const date = new Date(item.at || Date.now());
          row.innerHTML = `
            <div>
              <div><strong>${item.title || "Mock Test"}</strong></div>
              <div class="score-meta">${date.toLocaleDateString()} • ${date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div>
            </div>
            <div>${item.score}/${item.total}</div>
          `;
          list.appendChild(row);
        }
      };

      render(publicList, publics);
      render(customList, customs);
    }

    renderScores();
  </script>
</body>
</html>
