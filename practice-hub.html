<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice - Teachmint</title>
  <style>
    :root {
      --bg: #07080f;
      --panel: #0f111b;
      --line: #2a2f41;
      --text: #f2f4ff;
      --muted: #99a0bc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% -5%, #203066 0%, transparent 45%),
        linear-gradient(160deg, #07080f 0%, #0a0d1a 60%, #080a13 100%);
      min-height: 100vh;
      padding-bottom: 86px;
    }
    .hidden { display: none !important; }
    .app-wrap {
      width: min(600px, 94vw);
      margin: 1.1rem auto;
    }
    .panel {
      background: linear-gradient(150deg, rgba(22, 24, 38, 0.95), rgba(15, 17, 27, 0.95));
      border: 1px solid #252a3a;
      border-radius: 16px;
      padding: 1rem;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.75rem;
    }
    .brand-row { display: flex; align-items: center; gap: 0.65rem; }
    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(160deg, #2cc2ff, #0f8dcc);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(24, 181, 255, 0.35);
    }
    .brand-logo svg { width: 25px; height: 25px; }
    h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2rem); }
    .welcome { color: var(--muted); font-size: 0.88rem; margin-top: 0.15rem; }
    .logout-btn {
      border: 1px solid #3a405a;
      background: #21263a;
      color: #f2f4ff;
      border-radius: 12px;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .exam-shell {
      border: 1px solid #2f3a56;
      border-radius: 12px;
      background: linear-gradient(155deg, #171f34, #13192a);
      padding: 0.58rem 0.65rem;
      margin-bottom: 0.9rem;
    }
    .exam-label {
      font-size: 0.77rem;
      color: #8ea1cb;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.34rem;
      font-weight: 600;
    }
    .exam-select-wrap {
      position: relative;
    }
    .exam-trigger {
      width: 100%;
      border: 1px solid #3f4f77;
      border-radius: 11px;
      background: #1b2642;
      color: #eef3ff;
      padding: 0.66rem 2rem 0.66rem 0.72rem;
      font: inherit;
      text-align: left;
      cursor: pointer;
      position: relative;
    }
    .exam-trigger::after {
      content: "";
      position: absolute;
      right: 0.68rem;
      top: 50%;
      width: 0.46rem;
      height: 0.46rem;
      border-right: 2px solid #9cb2de;
      border-bottom: 2px solid #9cb2de;
      transform: translateY(-65%) rotate(45deg);
      opacity: 0.9;
    }
    .exam-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 0.38rem);
      z-index: 8;
      border: 1px solid #425585;
      border-radius: 11px;
      background: #182238;
      padding: 0.25rem;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.34);
    }
    .exam-option {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #eaf0ff;
      text-align: left;
      padding: 0.48rem 0.5rem;
      font: inherit;
      cursor: pointer;
    }
    .exam-option:hover,
    .exam-option.active {
      background: #243458;
      color: #fff;
    }
    .topic-shell {
      border: 1px solid #2b3653;
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(27, 34, 52, 0.94), rgba(17, 23, 38, 0.94));
      padding: 0.72rem;
    }
    .topic-picker-btn {
      width: 100%;
      border: 1px solid #3d4f77;
      border-radius: 12px;
      background: linear-gradient(160deg, #213156, #1b2947);
      color: #eef3ff;
      padding: 0.72rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      cursor: pointer;
      text-align: left;
      margin-bottom: 0.7rem;
    }
    .topic-picker-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.25;
    }
    .topic-picker-meta {
      margin-top: 0.2rem;
      color: #a8b5d9;
      font-size: 0.86rem;
    }
    .topic-proficiency {
      margin-top: 0.35rem;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .topic-proficiency-note {
      margin-top: 0.18rem;
      font-size: 0.85rem;
    }
    .topic-proficiency.not-started { color: #9fb0d6; }
    .topic-proficiency.weak { color: #ff7b7b; }
    .topic-proficiency.average { color: #f6b94a; }
    .topic-proficiency.expert { color: #7fe6a8; }
    .topic-proficiency.exceptional { color: #27c46b; }
    .topic-proficiency-note.not-started { color: #c7d2f0; }
    .topic-proficiency-note.weak { color: #ffc0c0; }
    .topic-proficiency-note.average { color: #f3d59c; }
    .topic-proficiency-note.expert { color: #baf2d2; }
    .topic-proficiency-note.exceptional { color: #8be6b6; }
    .topic-picker-caret {
      color: #9eb2df;
      font-size: 0.9rem;
      flex: 0 0 auto;
    }
    .journey-wrap {
      border: 1px solid #28314a;
      border-radius: 12px;
      background: rgba(17, 25, 41, 0.75);
      padding: 0.8rem 0.52rem 0.7rem;
    }
    .journey-stage {
      position: relative;
      height: 290px;
      margin-top: 0.6rem;
    }
    .journey-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .journey-path-soft {
      fill: none;
      stroke: rgba(115, 181, 255, 0.16);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .journey-path-dots {
      fill: none;
      stroke: rgba(153, 216, 255, 0.7);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 0.4 6;
    }
    .track-btn {
      border: 0;
      background: transparent;
      color: #f3f4ff;
      cursor: pointer;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      min-width: 0;
      width: 96px;
      position: absolute;
      z-index: 1;
    }
    .track-btn.active .hex {
      box-shadow: 0 0 0 2px rgba(84, 183, 255, 0.65), 0 0 18px rgba(84, 183, 255, 0.4);
      border-color: rgba(200, 230, 255, 0.8);
    }
    .action-icon-slot {
      width: 86px;
      height: 82px;
      display: grid;
      place-items: center;
    }
    .hex {
      width: 62px;
      height: 68px;
      clip-path: polygon(50% 0%, 92% 24%, 92% 76%, 50% 100%, 8% 76%, 8% 24%);
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.22rem;
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .track-btn .action-label {
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.1;
      font-weight: 600;
      order: 1;
      margin-top: 0.2rem;
    }
    .track-easy .hex { background: linear-gradient(145deg, #56c93a, #3b9f24); }
    .track-medium .hex { background: linear-gradient(145deg, #3aa7f2, #1f75bd); }
    .track-hard .hex { background: linear-gradient(145deg, #9656f2, #6730b9); }
    .track-pyqs .hex { background: linear-gradient(145deg, #cf8b2d, #9b651f); }
    .track-extras .hex { background: linear-gradient(145deg, #1fb6a5, #0d8176); }
    .track-easy { left: 12px; top: 36px; }
    .track-medium { left: 50%; transform: translateX(-50%); top: 36px; }
    .track-hard { right: 12px; top: 36px; }
    .track-pyqs { left: 12px; bottom: 4px; }
    .track-extras { right: 12px; bottom: 4px; }
    .empty {
      border: 1px solid #303850;
      border-radius: 12px;
      background: #151a2a;
      color: #c5cee9;
      padding: 0.95rem;
      text-align: center;
    }
    .picker-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(5, 7, 12, 0.72);
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .picker-modal {
      width: min(640px, 96vw);
      max-height: min(84vh, 680px);
      overflow: auto;
      border: 1px solid #334775;
      border-radius: 14px;
      background: linear-gradient(165deg, #131b30 0%, #101725 100%);
      padding: 1rem 1.05rem 1.1rem;
    }
    .picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-bottom: 0.7rem;
    }
    .picker-title {
      margin: 0;
      font-size: 1.04rem;
    }
    .picker-close {
      border: 1px solid #445682;
      background: #1f2a45;
      color: #eff4ff;
      border-radius: 10px;
      padding: 0.32rem 0.54rem;
      cursor: pointer;
      font: inherit;
      font-size: 0.86rem;
    }
    .picker-section + .picker-section { margin-top: 0.95rem; }
    .picker-subject {
      margin: 0 0 0.42rem;
      font-size: 0.92rem;
      color: #c9d8ff;
      font-weight: 600;
    }
    .picker-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.6rem;
    }
    .picker-item-btn {
      width: 100%;
      text-align: left;
      border: 1px solid #40537f;
      border-radius: 10px;
      background: #1c2743;
      color: #e7ecff;
      padding: 0.7rem 0.8rem;
      font: inherit;
      font-size: 0.88rem;
      cursor: pointer;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0.6rem;
    }
    .picker-item-btn.active {
      border-color: #4ac0ff;
      background: #20456e;
      box-shadow: inset 0 0 0 1px rgba(77, 193, 255, 0.35);
    }
    .picker-item-level {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .level-not-started { color: #c7d2f0; background: rgba(159, 176, 214, 0.22); }
    .level-weak { color: #ffc0c0; background: rgba(255, 123, 123, 0.22); }
    .level-average { color: #f3d59c; background: rgba(246, 185, 74, 0.22); }
    .level-expert { color: #baf2d2; background: rgba(127, 230, 168, 0.22); }
    .level-exceptional { color: #8be6b6; background: rgba(39, 196, 107, 0.28); }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      border-top: 1px solid #2d3551;
      background: rgba(10, 14, 24, 0.97);
      backdrop-filter: blur(6px);
      padding: 0.55rem 0.8rem calc(0.55rem + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.6rem;
    }
    .bottom-btn {
      border: 1px solid #3a4260;
      border-radius: 12px;
      background: #1a2237;
      color: #dbe4ff;
      padding: 0.62rem 0.5rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .bottom-btn.active {
      border-color: #2aa8f4;
      background: #223d63;
      color: #eff6ff;
      box-shadow: inset 0 0 0 1px rgba(47, 155, 240, 0.35);
    }

    .chat-fab {
      position: fixed;
      right: 1rem;
      bottom: 4.8rem;
      z-index: 25;
      border: 0;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2f9bf0, #2377bc);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(35, 119, 188, 0.35);
    }

    .chat-fab svg { width: 34px; height: 34px; }
    .chat-hint {
      position: fixed;
      right: 5.4rem;
      bottom: 5.2rem;
      z-index: 24;
      max-width: 260px;
      padding: 0.55rem 0.7rem;
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(25, 36, 64, 0.98), rgba(12, 19, 36, 0.96));
      border: 1px solid rgba(88, 163, 255, 0.55);
      color: #eef5ff;
      font-size: 0.82rem;
      line-height: 1.3;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      animation: hintPulse 2.8s ease-in-out infinite;
    }
    .chat-hint strong {
      display: block;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9fd3ff;
      margin-bottom: 0.2rem;
    }
    @keyframes hintPulse {
      0%, 100% { box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35), 0 0 0 rgba(88,163,255,0.0); }
      50% { box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45), 0 0 14px rgba(88,163,255,0.35); }
    }
    @media (max-width: 520px) {
      .app-wrap { width: 95vw; }
      .track-btn { width: 90px; }
      .action-icon-slot { width: 80px; }
      .hex { width: 58px; height: 64px; }
    }
  </style>
</head>
<body>
  <main class="app-wrap">
    <section class="panel">
      <div class="topbar">
        <div>
          <div class="brand-row">
            <div class="brand-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 7.5L12 3l9 4.5-9 4.5L3 7.5Z" fill="#E7F8FF" opacity=".95"/>
                <path d="M3 11.6 12 16l9-4.4" stroke="#D6F2FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 7.2v11.2" stroke="#0C5E8D" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </div>
            <h1>Teachmint</h1>
          </div>
          <div class="welcome" id="welcomeText">Practice</div>
        </div>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </div>

      <div class="exam-shell">
        <div class="exam-label">Exam</div>
        <div class="exam-select-wrap">
          <button id="examTrigger" class="exam-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">JEE</button>
          <div id="examMenu" class="exam-menu hidden" role="listbox" aria-label="Select exam">
            <button class="exam-option" data-exam="JEE" type="button">JEE</button>
            <button class="exam-option" data-exam="NEET" type="button">NEET (UG)</button>
          </div>
        </div>
      </div>

      <div id="topicShell" class="topic-shell">
        <button id="topicPickerBtn" class="topic-picker-btn" type="button" aria-haspopup="dialog" aria-controls="chapterPickerOverlay">
          <span>
            <h3 id="topicPickerTitle" class="topic-picker-title">Select chapter</h3>
            <div id="topicPickerMeta" class="topic-picker-meta"></div>
          </span>
          <span class="topic-picker-caret">&#9660;</span>
        </button>
        <div id="journeyHost"></div>
      </div>
    </section>
  </main>

  <div id="chapterPickerOverlay" class="picker-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="chapterPickerTitle">
    <div class="picker-modal">
      <div class="picker-head">
        <h3 id="chapterPickerTitle" class="picker-title">Select Subject and Chapter</h3>
        <button id="closeChapterPicker" class="picker-close" type="button">Close</button>
      </div>
      <div id="chapterPickerBody"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Bottom navigation">
    <button id="goStudyBtn" class="bottom-btn" type="button">Study Materials</button>
    <button class="bottom-btn active" type="button">Practice</button>
    <button id="goTestSeriesBtn" class="bottom-btn" type="button">Test Series</button>
  </nav>

  <button id="chatFab" class="chat-fab" type="button" aria-label="Open chat">
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#4FAEFF" stroke="#0C2B57" stroke-width="2"/>
      <circle cx="24" cy="26" r="4" fill="#F6FBFF" stroke="#0C2B57" stroke-width="2"/>
      <circle cx="40" cy="26" r="4" fill="#F6FBFF" stroke="#0C2B57" stroke-width="2"/>
      <path d="M34 34 C32 36,30 36,28 34" stroke="#102443" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M46 40 C52 42,54 48,46 50" stroke="#2F7DFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M18 44 C20 52,28 54,30 46" stroke="#1B4FE0" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </button>
  <div id="chatHint" class="chat-hint"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="curriculum-data.js"></script>
  <script>
    const api = window.teachmintApi;
    const params = new URLSearchParams(window.location.search);

    const welcomeText = document.getElementById("welcomeText");
    const logoutBtn = document.getElementById("logoutBtn");
    const goStudyBtn = document.getElementById("goStudyBtn");
    const goTestSeriesBtn = document.getElementById("goTestSeriesBtn");
    const examTrigger = document.getElementById("examTrigger");
    const examMenu = document.getElementById("examMenu");
    const examOptions = Array.from(document.querySelectorAll(".exam-option"));
    const topicPickerBtn = document.getElementById("topicPickerBtn");
    const topicPickerTitle = document.getElementById("topicPickerTitle");
    const topicPickerMeta = document.getElementById("topicPickerMeta");
    const journeyHost = document.getElementById("journeyHost");
    const chapterPickerOverlay = document.getElementById("chapterPickerOverlay");
    const closeChapterPicker = document.getElementById("closeChapterPicker");
    const chapterPickerBody = document.getElementById("chapterPickerBody");
    const chatFab = document.getElementById("chatFab");
    const chatHint = document.getElementById("chatHint");

    let currentUser = null;
    let selectedPracticeExam = "JEE";
    let selectedPracticeSubject = "";
    let selectedPracticeChapter = "";
    let selectedPracticeTrack = "";
    let attemptsCache = [];

    function syncExamDropdown() {
      examTrigger.textContent = selectedPracticeExam;
      examTrigger.setAttribute("aria-expanded", examMenu.classList.contains("hidden") ? "false" : "true");
      for (const option of examOptions) {
        option.classList.toggle("active", option.dataset.exam === selectedPracticeExam);
      }
    }

    function closeExamMenu() {
      examMenu.classList.add("hidden");
      syncExamDropdown();
    }

    function getCurriculumTopicsForExam(exam) {
      const source = window.curriculumData && window.curriculumData.catalog ? window.curriculumData.catalog : {};
      const map = source && typeof source[exam] === "object" ? source[exam] : {};
      return map && typeof map === "object" ? map : {};
    }

    function ensureSelectedPracticeTopic() {
      const subjectMap = getCurriculumTopicsForExam(selectedPracticeExam);
      const hasSelected = Boolean(
        selectedPracticeSubject
        && selectedPracticeChapter
        && Array.isArray(subjectMap[selectedPracticeSubject])
        && subjectMap[selectedPracticeSubject].includes(selectedPracticeChapter)
      );
      if (hasSelected) return true;
      const subjects = Object.keys(subjectMap);
      if (!subjects.length) {
        selectedPracticeSubject = "";
        selectedPracticeChapter = "";
        return false;
      }
      selectedPracticeSubject = subjects[0];
      const chapters = Array.isArray(subjectMap[selectedPracticeSubject]) ? subjectMap[selectedPracticeSubject] : [];
      selectedPracticeChapter = chapters[0] || "";
      return Boolean(selectedPracticeChapter);
    }

    async function loadAttemptsForSubject() {
      attemptsCache = [];
      if (!api || !api.isConfigured() || !currentUser) return;
      if (!selectedPracticeSubject) return;
      try {
        attemptsCache = await api.listChatAttempts(currentUser.id, selectedPracticeExam, selectedPracticeSubject);
      } catch {
        attemptsCache = [];
      }
    }

    function getProficiencyForChapter(chapter) {
      const attempts = attemptsCache.filter((a) => a.chapter === chapter);
      if (!attempts.length) {
        return {
          level: "Not Started",
          note: "Start with Easy questions to begin building confidence."
        };
      }
      const correct = attempts.filter((a) => a.correct).length;
      const accuracy = correct / attempts.length;
      if (accuracy < 0.5) {
        return {
          level: "Weak",
          note: "Stay with Easy and a few Medium questions to strengthen fundamentals."
        };
      }
      if (accuracy < 0.75) {
        return {
          level: "Average",
          note: "Mix Easy and Medium questions to sharpen accuracy."
        };
      }
      if (accuracy < 0.9) {
        return {
          level: "Expert",
          note: "Add Hard questions to push your speed and depth."
        };
      }
      return {
        level: "Exceptional",
        note: "You’re strong here—try PYQs and mixed practice to stay sharp."
      };
    }

    function createPracticeJourney(subject, chapter) {
      const tracks = [
        { id: "Easy", label: "Easy", css: "track-easy" },
        { id: "Medium", label: "Medium", css: "track-medium" },
        { id: "Hard", label: "Hard", css: "track-hard" },
        { id: "PYQs", label: "PYQs", css: "track-pyqs" },
        { id: "Extras", label: "Extras", css: "track-extras" }
      ];
      const wrap = document.createElement("div");
      wrap.className = "journey-wrap";
      wrap.innerHTML = `
        <div id="topicProficiency" class="topic-proficiency"></div>
        <div id="topicProficiencyNote" class="topic-proficiency-note"></div>
        <div class="journey-stage">
          <svg class="journey-lines" viewBox="0 0 100 170" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
      `;

      const stage = wrap.querySelector(".journey-stage");
      for (const track of tracks) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `track-btn ${track.css} ${track.id === selectedPracticeTrack ? "active" : ""}`.trim();
        btn.innerHTML = `<span class="action-icon-slot"><span class="hex">&#9654;</span></span><span class="action-label">${track.label}</span>`;
        btn.addEventListener("click", () => {
          selectedPracticeTrack = track.id;
          const url = `topic-practice.html?exam=${encodeURIComponent(selectedPracticeExam)}&subject=${encodeURIComponent(subject)}&chapter=${encodeURIComponent(chapter)}&track=${encodeURIComponent(track.id)}`;
          window.location.href = url;
        });
        stage.appendChild(btn);
      }
      return wrap;
    }

    async function renderPractice() {
      journeyHost.innerHTML = "";
      const ok = ensureSelectedPracticeTopic();
      if (!ok) {
        topicPickerTitle.textContent = "No chapter available";
        topicPickerMeta.textContent = "";
        topicProficiency.textContent = "";
        topicProficiencyNote.textContent = "";
        topicPickerBtn.disabled = true;
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No chapter available for selected exam.";
        journeyHost.appendChild(empty);
        return;
      }
      topicPickerBtn.disabled = false;
      topicPickerTitle.textContent = selectedPracticeChapter;
      topicPickerMeta.textContent = selectedPracticeSubject;
      await loadAttemptsForSubject();
      journeyHost.appendChild(createPracticeJourney(selectedPracticeSubject, selectedPracticeChapter));
      const profEl = journeyHost.querySelector("#topicProficiency");
      const profNoteEl = journeyHost.querySelector("#topicProficiencyNote");
      const prof = getProficiencyForChapter(selectedPracticeChapter);
      if (profEl) {
        profEl.textContent = prof.level ? `Level: ${prof.level}` : "";
        profEl.className = `topic-proficiency ${String(prof.level || "").toLowerCase()}`.trim();
      }
      if (profNoteEl) {
        profNoteEl.textContent = prof.note || "";
        profNoteEl.className = `topic-proficiency-note ${String(prof.level || "").toLowerCase()}`.trim();
      }
      if (chatHint) {
        const level = String(prof.level || "").toLowerCase();
        const chapterAttempts = attemptsCache.filter((a) => a.chapter === selectedPracticeChapter);
        const total = chapterAttempts.length;
        const correct = chapterAttempts.filter((a) => a.correct).length;
        const accuracy = total ? correct / total : 0;
        let focus = "Easy questions";
        if (level === "average") focus = "a mix of Easy and Medium questions";
        if (level === "expert") focus = "Hard questions for depth";
        if (level === "exceptional") focus = "PYQs to stay sharp";
        if (level === "not started") focus = "Easy questions to get started";
        if (level === "weak") focus = "Easy questions to rebuild fundamentals";

        const shouldMock = (total >= 15 && accuracy >= 0.7) || level === "exceptional";
        const msg = shouldMock
          ? `You’ve built momentum in ${selectedPracticeChapter}. Try a Mock Test now to check timing and accuracy.`
          : `Next up: ${selectedPracticeChapter} (${selectedPracticeSubject}) — try ${focus}.`;
        chatHint.innerHTML = `<strong>Techy Suggests</strong>${msg}`;
      }
    }

    async function openChapterPicker() {
      await loadAttemptsForSubject();
      const subjectMap = getCurriculumTopicsForExam(selectedPracticeExam);
      const subjects = Object.keys(subjectMap);
      chapterPickerBody.innerHTML = "";
      if (!subjects.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No chapter available for selected exam.";
        chapterPickerBody.appendChild(empty);
      } else {
        for (const subject of subjects) {
          const section = document.createElement("section");
          section.className = "picker-section";
          const heading = document.createElement("h4");
          heading.className = "picker-subject";
          heading.textContent = subject;
          section.appendChild(heading);

          const list = document.createElement("ul");
          list.className = "picker-list";
          const chapters = Array.isArray(subjectMap[subject]) ? subjectMap[subject] : [];
          for (const chapter of chapters) {
            const li = document.createElement("li");
            const item = document.createElement("button");
            item.type = "button";
            item.className = `picker-item-btn ${subject === selectedPracticeSubject && chapter === selectedPracticeChapter ? "active" : ""}`.trim();
            const prof = getProficiencyForChapter(chapter);
            const levelKey = String(prof.level || "").toLowerCase().replace(/\s+/g, "-");
            item.innerHTML = `<span>${chapter}</span><span class="picker-item-level level-${levelKey}">${prof.level || ""}</span>`;
            item.addEventListener("click", async () => {
              selectedPracticeSubject = subject;
              selectedPracticeChapter = chapter;
              await renderPractice();
              closeChapterPickerDialog();
            });
            li.appendChild(item);
            list.appendChild(li);
          }
          section.appendChild(list);
          chapterPickerBody.appendChild(section);
        }
      }
      chapterPickerOverlay.classList.remove("hidden");
    }

    function closeChapterPickerDialog() {
      chapterPickerOverlay.classList.add("hidden");
    }

    async function init() {
      if (!api || !api.isConfigured()) {
        window.location.href = "index.html";
        return;
      }

      try {
        currentUser = await api.getCurrentUser();
      } catch {
        currentUser = null;
      }
      if (!currentUser) {
        window.location.href = "index.html";
        return;
      }

      welcomeText.textContent = `Signed in as ${currentUser.email || "user"}`;
      selectedPracticeExam = "JEE";
      try {
        const onboarding = await api.getUserOnboarding(currentUser.id);
        const preferredExamRaw = onboarding && typeof onboarding.exam_target === "string"
          ? onboarding.exam_target.trim()
          : "";
        const preferredExam = preferredExamRaw.replace(/\(.*?\)/g, "").trim().toUpperCase();
        if (["JEE", "NEET"].includes(preferredExam)) {
          selectedPracticeExam = preferredExam;
        }
      } catch {}
      const examFromQuery = (params.get("exam") || "").trim().toUpperCase();
      if (["JEE", "NEET"].includes(examFromQuery)) {
        selectedPracticeExam = examFromQuery;
      }
      const subjectFromQuery = (params.get("subject") || "").trim();
      const chapterFromQuery = (params.get("chapter") || "").trim();
      const trackFromQuery = (params.get("track") || "").trim();
      if (trackFromQuery) {
        selectedPracticeTrack = trackFromQuery;
      }
      if (subjectFromQuery && chapterFromQuery) {
        const subjectMap = getCurriculumTopicsForExam(selectedPracticeExam);
        const chapters = Array.isArray(subjectMap[subjectFromQuery]) ? subjectMap[subjectFromQuery] : [];
        if (chapters.includes(chapterFromQuery)) {
          selectedPracticeSubject = subjectFromQuery;
          selectedPracticeChapter = chapterFromQuery;
        }
      }
      syncExamDropdown();
      await renderPractice();
    }

    goStudyBtn.addEventListener("click", () => {
      window.location.href = "index.html";
    });
    goTestSeriesBtn.addEventListener("click", () => {
      window.location.href = "test-series.html";
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await api.signOut();
      } catch {}
      window.location.href = "index.html";
    });

    examTrigger.addEventListener("click", () => {
      examMenu.classList.toggle("hidden");
      syncExamDropdown();
    });
    for (const option of examOptions) {
      option.addEventListener("click", async () => {
        selectedPracticeExam = option.dataset.exam;
        selectedPracticeSubject = "";
        selectedPracticeChapter = "";
        closeExamMenu();
        await renderPractice();
      });
    }
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".exam-select-wrap")) {
        closeExamMenu();
      }
    });

    topicPickerBtn.addEventListener("click", openChapterPicker);
    closeChapterPicker.addEventListener("click", closeChapterPickerDialog);
    chapterPickerOverlay.addEventListener("click", (event) => {
      if (event.target === chapterPickerOverlay) {
        closeChapterPickerDialog();
      }
    });

    if (chatFab) {
      chatFab.addEventListener("click", () => {
        try {
          sessionStorage.setItem("chat_return_to", window.location.pathname.split("/").pop() || "practice-hub.html");
        } catch {}
        window.location.href = "chat.html";
      });
    }

    /* kept for behavior parity: refresh topic if exam changes from any future integrations */
    window.updatePracticeExam = async (exam) => {
      const normalized = String(exam || "").toUpperCase();
      if (!["JEE", "NEET"].includes(normalized)) return;
      selectedPracticeExam = normalized;
      selectedPracticeSubject = "";
      selectedPracticeChapter = "";
      closeExamMenu();
      await renderPractice();
    };

    init();
  </script>
</body>
</html>
